<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>📊 주식 포트폴리오</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d2e; --card2: #21253a;
      --border: #2a2d3e; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #6366f1; --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* NAV */
    .nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: 0; z-index: 100; }
    .nav button { padding: 14px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 14px; white-space: nowrap; transition: color 0.15s; }
    .nav button:hover { color: var(--text); }
    .nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* TABS */
    .tab { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; }
    .tab.active { display: block; }

    /* CARDS */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .card-val { font-size: 22px; font-weight: 700; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .sec-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }

    /* GRID */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
    @media(max-width:700px) { .grid4,.grid3 { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
    @media(max-width:420px) { .grid4,.grid3,.grid2 { grid-template-columns: 1fr; } }

    /* TABLES */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: rgba(255,255,255,0.02); }
    .tbl-wrap { overflow-x: auto; }

    /* FORM */
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
    .fg { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
    .fg-sm { flex: 0 0 90px; min-width: 0; }
    .fg-md { flex: 0 0 130px; min-width: 0; }
    label { font-size: 12px; color: var(--muted); }
    input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 10px; font-size: 13px; width: 100%; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* BUTTONS */
    .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; }
    .btn-del { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn-del:hover { background: rgba(239,68,68,0.3); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    /* COLORS */
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .muted { color: var(--muted); }

    /* BADGES */
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
    .badge-etf { background: rgba(99,102,241,0.2); color: var(--accent); }
    .badge-stock { background: rgba(245,158,11,0.2); color: var(--yellow); }
    .badge-buy { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-sell { background: rgba(239,68,68,0.15); color: var(--red); }

    /* CHART */
    .chart-wrap { position: relative; height: 220px; }

    /* MISC */
    .empty { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; }
    code { background: var(--card2); border-radius: 4px; padding: 1px 5px; font-size: 12px; }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 16px; font-size: 13px; z-index: 9999; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; max-width: 320px; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<nav class="nav">
  <button onclick="showTab('dashboard')" data-tab="dashboard" class="active">대시보드</button>
  <button onclick="showTab('holdings')" data-tab="holdings">보유종목</button>
  <button onclick="showTab('transactions')" data-tab="transactions">거래내역</button>
  <button onclick="showTab('cashflows')" data-tab="cashflows">입출금</button>
  <button onclick="showTab('settings')" data-tab="settings">설정</button>
</nav>

<div id="tab-dashboard"    class="tab active"></div>
<div id="tab-holdings"     class="tab"></div>
<div id="tab-transactions" class="tab"></div>
<div id="tab-cashflows"    class="tab"></div>
<div id="tab-settings"     class="tab"></div>

<div id="toast" class="toast"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'portfolio_v5';

const mkState = () => ({
  transactions: [],   // {id,date,type:'buy'|'sell',ticker,name,assetType:'etf'|'stock',qty,price,currency:'KRW'|'USD',fee}
  cashflows:    [],   // {id,date,type:'deposit'|'withdraw',amount,currency:'KRW'|'USD',memo}
  targets:      {},   // {ticker: targetPct}
  prices:       {},   // {ticker:{price,dayChg,dayPct,currency,fetchedAt}}
  settings:     { manualRate: null }
});

let S = mkState();
let _charts = {};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) S = Object.assign(mkState(), JSON.parse(raw));
  } catch(e) {}
  migrateOld();
}

function migrateOld() {
  if (S.transactions.length > 0) return;
  for (const k of ['etf_v4','etf_v3','etf_portfolio_v2']) {
    const raw = localStorage.getItem(k);
    if (!raw) continue;
    try {
      const old = JSON.parse(raw);
      const etfs = (old.etfs || []).filter(e => e.ticker && +e.quantity > 0);
      if (!etfs.length) continue;
      const today = todayStr();
      for (const e of etfs) {
        S.transactions.push({
          id: uid(), date: today, type: 'buy',
          ticker: e.ticker, name: e.name || e.ticker,
          assetType: 'etf', qty: +e.quantity,
          price: +(e.avgPrice || e.avg_price || 0),
          currency: e.currency || detectCur(e.ticker), fee: 0
        });
        if (e.targetPct) S.targets[e.ticker] = +e.targetPct;
      }
      if (old.manualRate) S.settings.manualRate = old.manualRate;
      save();
      break;
    } catch(e) {}
  }
}

// ═══════════════════════════════════════════════════════════════
// COMPUTATION
// ═══════════════════════════════════════════════════════════════

/**
 * From transaction history, compute current holdings.
 * Returns map: ticker → {ticker,name,assetType,currency,qty,avgPrice,totalCost,realizedPnl}
 * Includes tickers with qty=0 (for realizedPnl display).
 */
function computeHoldings() {
  const map = {};
  const sorted = [...S.transactions].sort((a,b) =>
    a.date !== b.date ? a.date.localeCompare(b.date) : a.id.localeCompare(b.id));

  for (const tx of sorted) {
    if (!map[tx.ticker]) {
      map[tx.ticker] = {
        ticker: tx.ticker, name: tx.name,
        assetType: tx.assetType || 'stock', currency: tx.currency,
        qty: 0, avgPrice: 0, totalCost: 0, realizedPnl: 0
      };
    }
    const h = map[tx.ticker];
    h.name = tx.name; // keep latest

    if (tx.type === 'buy') {
      // Fee included in cost basis → avg price rises slightly
      const cost = tx.qty * tx.price + (tx.fee || 0);
      h.totalCost += cost;
      h.qty += tx.qty;
      h.avgPrice = h.qty > 0 ? h.totalCost / h.qty : 0;
    } else {
      // sell: realized = proceeds − (avgPrice × qty)
      const proceeds  = tx.qty * tx.price - (tx.fee || 0);
      const costBasis = h.avgPrice * tx.qty;
      h.realizedPnl += proceeds - costBasis;
      h.qty = Math.max(0, h.qty - tx.qty);
      h.totalCost = h.qty * h.avgPrice;
      if (h.qty === 0) { h.avgPrice = 0; h.totalCost = 0; }
    }
  }
  return map;
}

function getRate() {
  return S.settings.manualRate || S._cachedRate || 1380;
}

function toKRW(amount, currency) {
  return currency === 'USD' ? amount * getRate() : amount;
}

function computeStats(holdings) {
  const rate = getRate();
  let totalVal = 0, totalCost = 0, totalRealized = 0, dayChange = 0;

  for (const h of Object.values(holdings)) {
    totalRealized += toKRW(h.realizedPnl, h.currency);
    if (h.qty > 0) {
      const p      = S.prices[h.ticker];
      const price  = p ? p.price : h.avgPrice;
      const val    = toKRW(price * h.qty, h.currency);
      const cost   = toKRW(h.avgPrice * h.qty, h.currency);
      totalVal  += val;
      totalCost += cost;
      if (p && p.dayChg) dayChange += toKRW(p.dayChg * h.qty, h.currency);
    }
  }

  // Cash balance = deposits − withdrawals − buy spends + sell proceeds
  let cashKRW = 0, cashUSD = 0;
  for (const cf of S.cashflows) {
    const s = cf.type === 'deposit' ? 1 : -1;
    if (cf.currency === 'KRW') cashKRW += s * cf.amount;
    else cashUSD += s * cf.amount;
  }
  for (const tx of S.transactions) {
    const s   = tx.type === 'buy' ? -1 : 1;
    const amt = tx.qty * tx.price + (tx.type === 'buy' ? (tx.fee||0) : -(tx.fee||0));
    if (tx.currency === 'KRW') cashKRW += s * amt;
    else cashUSD += s * amt;
  }
  const cashKRWTotal = cashKRW + cashUSD * rate;

  // Net invested = net deposits
  let depKRW = 0, depUSD = 0;
  for (const cf of S.cashflows) {
    const s = cf.type === 'deposit' ? 1 : -1;
    if (cf.currency === 'KRW') depKRW += s * cf.amount;
    else depUSD += s * cf.amount;
  }
  const netInvested = depKRW + depUSD * rate;
  const unrealized  = totalVal - totalCost;
  const totalPnl    = unrealized + totalRealized;
  const totalReturn = netInvested > 0 ? totalPnl / netInvested * 100 : 0;

  return { totalVal, totalCost, totalRealized, unrealized, totalPnl,
           dayChange, cashKRW, cashUSD, cashKRWTotal, netInvested, totalReturn };
}

// ═══════════════════════════════════════════════════════════════
// PRICE FETCH
// ═══════════════════════════════════════════════════════════════
async function fetchYF(ticker) {
  const url   = 'https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?range=1d&interval=1d';
  const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  for (const u of [url, proxy]) {
    try {
      const r = await fetch(u, { signal: AbortSignal.timeout(8000) });
      const d = await r.json();
      const meta = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
      if (meta && meta.regularMarketPrice) {
        const p = meta.regularMarketPrice, prev = meta.previousClose || p;
        return { price: p, dayChg: p - prev, dayPct: ((p - prev) / prev) * 100, currency: meta.currency };
      }
    } catch(e) {}
  }
  return null;
}

async function fetchRate() {
  if (S.settings.manualRate) return S.settings.manualRate;
  try {
    const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD', { signal: AbortSignal.timeout(8000) });
    const d = await r.json();
    return d.rates.KRW;
  } catch(e) { return null; }
}

async function fetchAllPrices() {
  const h = computeHoldings();
  const tickers = Object.keys(h).filter(t => h[t].qty > 0);
  if (!tickers.length) { toast('보유 종목이 없습니다'); return; }
  toast('가격 조회 중…');
  const tasks = [fetchRate()].concat(tickers.map(t => fetchYF(t).then(r => ({ ticker: t, result: r }))));
  const all   = await Promise.all(tasks);
  const rate  = all[0];
  if (rate) S._cachedRate = rate;
  let ok = 0;
  for (let i = 1; i < all.length; i++) {
    const { ticker, result } = all[i];
    if (result) {
      S.prices[ticker] = { price: result.price, dayChg: result.dayChg, dayPct: result.dayPct,
        currency: result.currency, fetchedAt: new Date().toISOString() };
      ok++;
    }
  }
  S._lastFetch = new Date().toISOString();
  save();
  renderAll();
  toast('✅ ' + ok + '/' + tickers.length + '개 종목 업데이트');
}

// ═══════════════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════════════
function uid()      { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function detectCur(t) { return (!t || /\.(KS|KQ)$/i.test(t) || /^\d{6}$/.test(t)) ? 'KRW' : 'USD'; }
function v(id)      { return (document.getElementById(id) ? document.getElementById(id).value : '').trim(); }
function esc(s)     {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtKRW(n) {
  if (n == null || isNaN(n)) return '-';
  const abs = Math.abs(Math.round(n));
  return (n < 0 ? '-' : '') + '₩' + abs.toLocaleString('ko-KR');
}
function fmtUSD(n) {
  if (n == null || isNaN(n)) return '-';
  return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
}
function fmtPrice(n, cur) { return cur === 'USD' ? fmtUSD(n) : fmtKRW(n); }
function fmtPct(n, d) {
  d = d == null ? 2 : d;
  if (n == null || isNaN(n)) return '-';
  return (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
}
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }

function toast(msg, ms) {
  ms = ms || 2800;
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, ms);
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.nav button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  document.getElementById('tab-' + name).classList.add('active');
  renderTab(name);
}

function renderTab(n) {
  if      (n === 'dashboard')    renderDashboard();
  else if (n === 'holdings')     renderHoldings();
  else if (n === 'transactions') renderTransactions();
  else if (n === 'cashflows')    renderCashflows();
  else if (n === 'settings')     renderSettings();
}

function renderAll() {
  const el = document.querySelector('.tab.active');
  const active = el ? el.id.replace('tab-','') : 'dashboard';
  renderTab(active);
}

function killChart(k) {
  if (_charts[k]) { _charts[k].destroy(); delete _charts[k]; }
}

const PALETTE = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#a78bfa','#34d399'];

// ═══════════════════════════════════════════════════════════════
// RENDER — DASHBOARD
// ═══════════════════════════════════════════════════════════════
function renderDashboard() {
  const h      = computeHoldings();
  const active = Object.values(h).filter(function(x) { return x.qty > 0; });
  const stats  = computeStats(h);
  const rate   = getRate();
  const lastFetch = S._lastFetch ? new Date(S._lastFetch).toLocaleString('ko-KR') : '없음';

  var rows = '';
  for (var i = 0; i < active.length; i++) {
    var x = active[i];
    var p = S.prices[x.ticker];
    var price  = p ? p.price : x.avgPrice;
    var valKRW = toKRW(price * x.qty, x.currency);
    var pnlPct = x.avgPrice > 0 ? (price - x.avgPrice) / x.avgPrice * 100 : 0;
    rows += '<tr>' +
      '<td><div style="font-weight:600;font-size:13px">' + esc(x.ticker) + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + esc(x.name) + '</div></td>' +
      '<td>' + fmtKRW(valKRW) + '</td>' +
      '<td class="' + cls(pnlPct) + '">' + fmtPct(pnlPct) + '</td>' +
      '<td class="' + cls(p ? p.dayPct : 0) + '">' + (p ? fmtPct(p.dayPct) : '<span class="muted">-</span>') + '</td>' +
    '</tr>';
  }

  document.getElementById('tab-dashboard').innerHTML =
    '<div class="row-between" style="margin-bottom:14px">' +
      '<span class="muted" style="font-size:12px">마지막 업데이트: ' + lastFetch + ' &nbsp;|&nbsp; 환율 ₩' + Math.round(rate).toLocaleString() + '</span>' +
      '<button class="btn btn-primary" onclick="fetchAllPrices()" style="font-size:13px;padding:7px 14px">📈 가격 업데이트</button>' +
    '</div>' +

    '<div class="grid4">' +
      '<div class="card"><div class="card-title">총 자산 (주식+현금)</div>' +
        '<div class="card-val">' + fmtKRW(stats.totalVal + stats.cashKRWTotal) + '</div>' +
        '<div class="card-sub">주식 ' + fmtKRW(stats.totalVal) + '</div>' +
        '<div class="card-sub">현금 ' + fmtKRW(stats.cashKRWTotal) + '</div></div>' +
      '<div class="card"><div class="card-title">순 투자금</div>' +
        '<div class="card-val">' + fmtKRW(stats.netInvested) + '</div>' +
        '<div class="card-sub">입금 − 출금</div></div>' +
      '<div class="card"><div class="card-title">미실현 손익</div>' +
        '<div class="card-val ' + cls(stats.unrealized) + '">' + fmtKRW(stats.unrealized) + '</div>' +
        '<div class="card-sub ' + cls(stats.unrealized) + '">' + fmtPct(stats.totalCost ? stats.unrealized/stats.totalCost*100 : 0) + '</div></div>' +
      '<div class="card"><div class="card-title">당일 손익</div>' +
        '<div class="card-val ' + cls(stats.dayChange) + '">' + fmtKRW(stats.dayChange) + '</div>' +
        '<div class="card-sub ' + cls(stats.totalRealized) + '">실현손익 ' + fmtKRW(stats.totalRealized) + '</div></div>' +
    '</div>' +

    '<div class="grid2">' +
      '<div class="card"><div class="card-title" style="margin-bottom:10px">자산 배분</div>' +
        (active.length ? '<div class="chart-wrap"><canvas id="allocChart"></canvas></div>' : '<div class="empty">보유 종목 없음</div>') +
      '</div>' +
      '<div class="card"><div class="card-title" style="margin-bottom:10px">보유 종목 현황</div>' +
        (active.length ?
          '<table class="tbl"><thead><tr><th>종목</th><th>평가금액</th><th>수익률</th><th>당일</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>' :
          '<div class="empty">거래내역을 입력하면<br>자동으로 표시됩니다</div>') +
      '</div>' +
    '</div>';

  if (active.length) {
    killChart('alloc');
    var vals   = active.map(function(x) {
      var p = S.prices[x.ticker];
      return toKRW((p ? p.price : x.avgPrice) * x.qty, x.currency);
    });
    var labels = active.map(function(x) { return x.ticker; });
    _charts['alloc'] = new Chart(document.getElementById('allocChart'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{ data: vals, backgroundColor: PALETTE.slice(0, vals.length), borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 12 } } }
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER — HOLDINGS
// ═══════════════════════════════════════════════════════════════
function renderHoldings() {
  var h      = computeHoldings();
  var active = Object.values(h).filter(function(x) { return x.qty > 0; });
  var totalValKRW = 0;
  for (var i = 0; i < active.length; i++) {
    var x = active[i];
    var p = S.prices[x.ticker];
    totalValKRW += toKRW((p ? p.price : x.avgPrice) * x.qty, x.currency);
  }
  var tgtSum = Object.values(S.targets).reduce(function(a,b) { return a+b; }, 0);

  var holdRows = '';
  for (var i = 0; i < active.length; i++) {
    var x      = active[i];
    var p      = S.prices[x.ticker];
    var price  = p ? p.price : x.avgPrice;
    var valKRW = toKRW(price * x.qty, x.currency);
    var costKRW = toKRW(x.avgPrice * x.qty, x.currency);
    var pnlKRW = valKRW - costKRW;
    var pnlPct = costKRW > 0 ? pnlKRW / costKRW * 100 : 0;
    var curPct = totalValKRW > 0 ? valKRW / totalValKRW * 100 : 0;
    var tgt    = S.targets[x.ticker] || 0;
    var diff   = curPct - tgt;
    var qtyStr = x.qty % 1 === 0 ? x.qty.toLocaleString() : x.qty.toFixed(4);
    holdRows +=
      '<tr>' +
      '<td><div style="font-weight:600">' + esc(x.ticker) + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + esc(x.name) + '</div>' +
        '<span class="badge badge-' + (x.assetType||'stock') + '">' + (x.assetType === 'etf' ? 'ETF' : '주식') + '</span></td>' +
      '<td>' + qtyStr + '</td>' +
      '<td>' + fmtPrice(x.avgPrice, x.currency) + '</td>' +
      '<td>' + (p ? fmtPrice(price, x.currency) : '<span class="muted">' + fmtPrice(x.avgPrice, x.currency) + '</span>') + '</td>' +
      '<td><strong>' + fmtKRW(valKRW) + '</strong></td>' +
      '<td class="' + cls(pnlKRW) + '">' + fmtKRW(pnlKRW) + '</td>' +
      '<td class="' + cls(pnlPct) + '">' + fmtPct(pnlPct) + '</td>' +
      '<td class="' + cls(p ? p.dayPct : 0) + '">' + (p ? fmtPct(p.dayPct) : '-') + '</td>' +
      '<td>' + curPct.toFixed(1) + '%</td>' +
      '<td style="white-space:nowrap">' +
        '<input type="number" value="' + tgt + '" min="0" max="100" step="0.1"' +
        ' style="width:55px;padding:4px 6px;font-size:12px"' +
        ' onchange="setTarget(\'' + esc(x.ticker) + '\',this.value)">%</td>' +
      '<td class="' + cls(-diff) + '">' + (diff > 0 ? '+' : '') + diff.toFixed(1) + '%</td>' +
      '</tr>';
  }

  var realizedRows = '';
  Object.values(h).forEach(function(x) {
    if (x.realizedPnl !== 0) {
      realizedRows += '<tr>' +
        '<td>' + esc(x.ticker) + ' <span class="muted">' + esc(x.name) + '</span></td>' +
        '<td class="' + cls(x.realizedPnl) + '">' + fmtKRW(toKRW(x.realizedPnl, x.currency)) + '</td>' +
        '</tr>';
    }
  });

  var html =
    '<div class="card">' +
      '<div class="row-between" style="margin-bottom:12px">' +
        '<div class="sec-title" style="margin:0">보유 종목</div>' +
        '<span class="muted" style="font-size:12px">환율 ₩' + Math.round(getRate()).toLocaleString() + '</span>' +
      '</div>' +
      (!active.length ?
        '<div class="empty">거래내역을 입력하면 자동으로 계산됩니다</div>' :
        '<div class="tbl-wrap"><table class="tbl">' +
          '<thead><tr><th>종목</th><th>수량</th><th>평균단가</th><th>현재가</th>' +
            '<th>평가금액</th><th>평가손익</th><th>수익률</th><th>당일</th>' +
            '<th>현재비중</th><th>목표비중</th><th>괴리</th></tr></thead>' +
          '<tbody>' + holdRows + '</tbody></table></div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:8px">목표비중 합계: ' + tgtSum.toFixed(1) + '% (100%에 맞추세요)</div>'
      ) +
    '</div>';

  if (realizedRows) {
    html += '<div class="card"><div class="sec-title">실현 손익</div>' +
      '<table class="tbl"><thead><tr><th>종목</th><th>실현 손익 (KRW)</th></tr></thead>' +
      '<tbody>' + realizedRows + '</tbody></table></div>';
  }

  var hasTargets = Object.keys(S.targets).length > 0;
  if (active.length && hasTargets) {
    html += '<div class="card"><div class="sec-title">목표 vs 현재 비중</div>' +
      '<div class="chart-wrap"><canvas id="barChart"></canvas></div></div>';
  }

  document.getElementById('tab-holdings').innerHTML = html;

  if (active.length && hasTargets) {
    killChart('bar');
    var labels   = active.map(function(x) { return x.ticker; });
    var curPcts  = active.map(function(x) {
      var p = S.prices[x.ticker];
      return totalValKRW > 0 ? toKRW((p ? p.price : x.avgPrice) * x.qty, x.currency) / totalValKRW * 100 : 0;
    });
    var tgtPcts = active.map(function(x) { return S.targets[x.ticker] || 0; });
    _charts['bar'] = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: '현재비중', data: curPcts, backgroundColor: 'rgba(99,102,241,0.7)' },
          { label: '목표비중', data: tgtPcts, backgroundColor: 'rgba(16,185,129,0.7)' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#94a3b8', callback: function(v) { return v+'%'; } }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    });
  }
}

function renderCashflows() {
  var cfs   = S.cashflows.slice().sort(function(a,b) { return b.date.localeCompare(a.date); });
  var today = todayStr();
  var rate  = getRate();
  var depKRW=0, wdKRW=0, depUSD=0, wdUSD=0;
  for (var i = 0; i < S.cashflows.length; i++) {
    var c = S.cashflows[i];
    if (c.currency==='KRW') { if (c.type==='deposit') depKRW+=c.amount; else wdKRW+=c.amount; }
    else                    { if (c.type==='deposit') depUSD+=c.amount; else wdUSD+=c.amount; }
  }

  // Cash currently uninvested
  var cashKRW=0, cashUSD=0;
  for (var i = 0; i < S.cashflows.length; i++) {
    var c = S.cashflows[i];
    var s = c.type==='deposit' ? 1 : -1;
    if (c.currency==='KRW') cashKRW += s*c.amount; else cashUSD += s*c.amount;
  }
  for (var i = 0; i < S.transactions.length; i++) {
    var tx = S.transactions[i];
    var s  = tx.type==='buy' ? -1 : 1;
    var amt = tx.qty*tx.price + (tx.type==='buy' ? (tx.fee||0) : -(tx.fee||0));
    if (tx.currency==='KRW') cashKRW += s*amt; else cashUSD += s*amt;
  }

  var cfRows = '';
  for (var i = 0; i < cfs.length; i++) {
    var c = cfs[i];
    cfRows +=
      '<tr>' +
      '<td class="muted">' + c.date + '</td>' +
      '<td><span class="badge badge-' + (c.type==='deposit'?'buy':'sell') + '">' + (c.type==='deposit'?'입금':'출금') + '</span></td>' +
      '<td>' + (c.currency==='KRW' ? fmtKRW(c.amount) : fmtUSD(c.amount)) + '</td>' +
      '<td class="muted">' + c.currency + '</td>' +
      '<td class="muted">' + esc(c.memo||'-') + '</td>' +
      '<td><button class="btn-xs btn-del" onclick="delCf(\'' + c.id + '\')">삭제</button></td>' +
      '</tr>';
  }

  document.getElementById('tab-cashflows').innerHTML =
    '<div class="grid4">' +
      '<div class="card"><div class="card-title">총 입금 (KRW)</div><div class="card-val pos">' + fmtKRW(depKRW) + '</div></div>' +
      '<div class="card"><div class="card-title">총 출금 (KRW)</div><div class="card-val neg">' + fmtKRW(wdKRW) + '</div></div>' +
      '<div class="card"><div class="card-title">USD 순입금</div><div class="card-val">' + fmtUSD(depUSD - wdUSD) + '</div></div>' +
      '<div class="card"><div class="card-title">현금 잔고</div>' +
        '<div class="card-val">' + fmtKRW(cashKRW + cashUSD * rate) + '</div>' +
        (cashUSD !== 0 ? '<div class="card-sub">KRW ' + fmtKRW(cashKRW) + ' + USD ' + fmtUSD(cashUSD) + '</div>' : '') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="sec-title">입출금 추가</div>' +
      '<div class="form-row">' +
        '<div class="fg fg-md"><label>날짜</label><input type="date" id="cf-date" value="' + today + '"></div>' +
        '<div class="fg fg-sm"><label>구분</label><select id="cf-type"><option value="deposit">입금</option><option value="withdraw">출금</option></select></div>' +
        '<div class="fg"><label>금액</label><input type="number" id="cf-amount" placeholder="1000000" min="0" step="any"></div>' +
        '<div class="fg fg-sm"><label>통화</label><select id="cf-currency"><option value="KRW">KRW</option><option value="USD">USD</option></select></div>' +
        '<div class="fg"><label>메모 (선택)</label><input type="text" id="cf-memo" placeholder="월급, 추가 투자 등"></div>' +
        '<div class="fg" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn btn-primary" onclick="addCf()">추가</button></div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="sec-title">입출금 내역 (' + cfs.length + '건)</div>' +
      (!cfs.length ?
        '<div class="empty">입출금 내역이 없습니다</div>' :
        '<table class="tbl">' +
          '<thead><tr><th>날짜</th><th>구분</th><th>금액</th><th>통화</th><th>메모</th><th></th></tr></thead>' +
          '<tbody>' + cfRows + '</tbody>' +
        '</table>'
      ) +
    '</div>';
}

// ═══════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════
function autoDetectCur() {
  var ticker = v('tx-ticker');
  var sel    = document.getElementById('tx-currency');
  if (sel) sel.value = detectCur(ticker);
}

function addTx() {
  var date      = v('tx-date');
  var type      = v('tx-type');
  var ticker    = v('tx-ticker').toUpperCase();
  var name      = v('tx-name') || ticker;
  var assetType = v('tx-asset');
  var qty       = parseFloat(v('tx-qty'));
  var price     = parseFloat(v('tx-price'));
  var currency  = v('tx-currency');
  var fee       = parseFloat(v('tx-fee')) || 0;

  if (!date || !ticker)            { toast('⚠️ 날짜와 티커를 입력하세요'); return; }
  if (isNaN(qty) || qty <= 0)      { toast('⚠️ 수량을 입력하세요'); return; }
  if (isNaN(price) || price < 0)   { toast('⚠️ 단가를 입력하세요'); return; }

  if (type === 'sell') {
    var h = computeHoldings()[ticker];
    if (!h || h.qty < qty) {
      toast('⚠️ 보유수량(' + ((h ? h.qty : 0).toFixed(4)) + ')보다 많이 매도할 수 없습니다');
      return;
    }
  }

  S.transactions.push({ id: uid(), date, type, ticker, name, assetType, qty, price, currency, fee });
  save();
  renderTransactions();
  toast('✅ ' + (type === 'buy' ? '매수' : '매도') + ' 추가 — ' + ticker);
}

function delTx(id) {
  if (!confirm('이 거래를 삭제하시겠습니까?')) return;
  S.transactions = S.transactions.filter(function(t) { return t.id !== id; });
  save(); renderAll(); toast('삭제됐습니다');
}

function addCf() {
  var date     = v('cf-date');
  var type     = v('cf-type');
  var amount   = parseFloat(v('cf-amount'));
  var currency = v('cf-currency');
  var memo     = v('cf-memo');

  if (!date || isNaN(amount) || amount <= 0) { toast('⚠️ 날짜와 금액을 입력하세요'); return; }
  S.cashflows.push({ id: uid(), date, type, amount, currency, memo });
  save(); renderCashflows();
  toast('✅ ' + (type === 'deposit' ? '입금' : '출금') + ' 내역 추가');
}

function delCf(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  S.cashflows = S.cashflows.filter(function(c) { return c.id !== id; });
  save(); renderCashflows(); toast('삭제됐습니다');
}

function setTarget(ticker, val) {
  var pct = parseFloat(val);
  S.targets[ticker] = (isNaN(pct) || pct < 0) ? 0 : pct;
  save();
}

function saveRate() {
  var val = parseFloat(document.getElementById('manual-rate').value);
  S.settings.manualRate = isNaN(val) ? null : val;
  save(); renderSettings(); toast('환율 저장됨');
}

function exportData() {
  // Compute holdings and include 'etfs' array for daily_check.py compatibility
  var h    = computeHoldings();
  var etfs = Object.values(h).filter(function(x) { return x.qty > 0; }).map(function(x) {
    return { ticker: x.ticker, name: x.name, quantity: x.qty, avgPrice: x.avgPrice, currency: x.currency };
  });
  var out = JSON.parse(JSON.stringify(S));
  out.etfs       = etfs;
  out.exportedAt = new Date().toISOString();
  delete out._cachedRate;
  delete out._lastFetch;

  var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'portfolio.json'; a.click();
  URL.revokeObjectURL(url);
  toast('내보내기 완료');
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (!data.transactions && !data.cashflows) { toast('⚠️ 올바른 포맷이 아닙니다'); return; }
      var txCount = (data.transactions || []).length;
      var cfCount = (data.cashflows || []).length;
      if (!confirm('데이터를 불러옵니다 (거래 ' + txCount + '건, 입출금 ' + cfCount + '건). 현재 데이터는 덮어씌워집니다.')) return;
      S = Object.assign(mkState(), data);
      save(); renderAll(); toast('✅ 가져오기 완료');
    } catch(ex) { toast('⚠️ JSON 파싱 오류'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

function clearAll() {
  if (!confirm('⚠️ 모든 거래내역, 입출금, 가격 데이터가 삭제됩니다.')) return;
  if (!confirm('정말로 초기화하시겠습니까?')) return;
  S = mkState(); _charts = {}; save(); renderAll(); toast('초기화 완료');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
load();
renderDashboard();
</script>

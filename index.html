<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>📊 주식 포트폴리오</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#0f1117; --card:#1a1d2e; --card2:#21253a;
      --border:#2a2d3e; --text:#e2e8f0; --muted:#94a3b8;
      --accent:#6366f1; --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

    .nav{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:0;z-index:100}
    .nav button{padding:13px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;transition:color .15s}
    .nav button:hover{color:var(--text)}
    .nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

    .auth-bar{background:var(--card2);border-bottom:1px solid var(--border);padding:7px 16px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}

    .tab{display:none;padding:16px;max-width:1000px;margin:0 auto}
    .tab.active{display:block}

    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
    .card-title{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
    .card-val{font-size:21px;font-weight:700}
    .card-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .sec-title{font-size:15px;font-weight:600;margin-bottom:12px}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    @media(max-width:700px){.grid4,.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
    @media(max-width:420px){.grid4,.grid3{grid-template-columns:1fr}}

    .tbl{width:100%;border-collapse:collapse;font-size:13px}
    .tbl th{text-align:left;color:var(--muted);font-weight:500;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
    .tbl td{padding:9px;border-bottom:1px solid var(--border);vertical-align:middle}
    .tbl tr:last-child td{border-bottom:none}
    .tbl tr:hover td{background:rgba(255,255,255,.02)}
    .tbl-wrap{overflow-x:auto}

    .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
    .fg{display:flex;flex-direction:column;gap:3px;flex:1;min-width:100px}
    .fg-sm{flex:0 0 85px;min-width:0}
    .fg-md{flex:0 0 125px;min-width:0}
    label{font-size:11px;color:var(--muted)}
    input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 9px;font-size:13px;width:100%}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
    input[type=number]{-moz-appearance:textfield}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    textarea{resize:vertical;min-height:60px}

    .btn{padding:8px 15px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-google{background:#fff;color:#333;border:1px solid #ddd;display:flex;align-items:center;gap:6px}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-xs{padding:3px 8px;font-size:11px;border-radius:6px;border:none;cursor:pointer}
    .btn-del{background:rgba(239,68,68,.15);color:var(--red)}
    .btn-del:hover{background:rgba(239,68,68,.3)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}

    .pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}
    .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600}
    .badge-etf{background:rgba(99,102,241,.2);color:var(--accent)}
    .badge-stock{background:rgba(245,158,11,.2);color:var(--yellow)}
    .badge-buy{background:rgba(16,185,129,.15);color:var(--green)}
    .badge-sell{background:rgba(239,68,68,.15);color:var(--red)}

    .chart-wrap{position:relative;height:240px}
    .chart-tall{height:280px}
    .empty{text-align:center;padding:32px;color:var(--muted);font-size:13px;line-height:1.6}
    .row-between{display:flex;justify-content:space-between;align-items:center}
    code{background:var(--card2);border-radius:4px;padding:1px 5px;font-size:12px}

    .memo-input{font-size:12px;padding:4px 7px;border-radius:6px;width:100%;min-width:80px}

    .toast{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 15px;font-size:13px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:300px}
    .toast.show{opacity:1;transform:translateY(0)}

    .tax-box{background:var(--card2);border-radius:10px;padding:14px;margin-bottom:10px}
    .tax-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border)}
    .tax-row:last-child{border-bottom:none;font-weight:600;padding-top:8px}

    .fb-step{background:var(--card2);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.7}
    .fb-step strong{color:var(--accent)}

    /* ── 자동완성 드롭다운 ── */
    .ac-wrap{position:relative}
    .ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--accent);border-radius:8px;z-index:500;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.4);max-height:220px;overflow-y:auto}
    .ac-item{padding:8px 11px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .ac-item:hover,.ac-item.active{background:rgba(99,102,241,.15)}
    .ac-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ac-item-ticker{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
    .ac-learned{font-size:9px;color:var(--green);margin-left:3px}

    /* ── 엑셀 가져오기 ── */
    .import-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
    .import-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:860px;padding:20px}
    .import-preview{max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin:12px 0}
    .import-row-skip{opacity:.4}
    .import-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .import-sum-chip{background:var(--card2);border-radius:8px;padding:8px 14px;font-size:13px}
    .import-sum-chip strong{display:block;font-size:18px;font-weight:700}
    .ticker-input{width:110px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 7px;font-size:12px}
    .ticker-input.ok{border-color:var(--green)}
    .ticker-input.missing{border-color:var(--yellow)}

    /* ── 모으기(DCA) ── */
    .dca-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .dca-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .dca-ticker{font-size:18px;font-weight:700}
    .dca-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .dca-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    @media(max-width:600px){.dca-stats{grid-template-columns:1fr 1fr}}
    .dca-stat{background:var(--card2);border-radius:8px;padding:10px 12px}
    .dca-stat-label{font-size:11px;color:var(--muted);margin-bottom:3px}
    .dca-stat-val{font-size:15px;font-weight:700}
    .dca-progress{height:6px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}
    .dca-progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
    .dca-badge-active{background:rgba(16,185,129,.15);color:var(--green)}
    .dca-badge-paused{background:rgba(148,163,184,.15);color:var(--muted)}
    .freq-day{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .freq-day label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg)}
    .freq-day input[type=checkbox]:checked+span{color:var(--accent);font-weight:600}

    /* ── 스프레드시트 ── */
    .ss-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:0}
    .ss-tab{padding:7px 14px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
    .ss-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .ss-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .ss-wrap{overflow:auto;max-height:calc(100vh - 240px);border:1px solid var(--border);border-radius:10px}
    .ss-tbl{border-collapse:collapse;font-size:12.5px;white-space:nowrap;width:100%}
    .ss-tbl thead th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--border);border-right:1px solid var(--border);text-align:left;z-index:2}
    .ss-tbl thead th:first-child{position:sticky;left:0;z-index:3}
    .ss-tbl tbody td{padding:7px 10px;border-bottom:1px solid var(--border);border-right:1px solid rgba(255,255,255,.04);vertical-align:middle}
    .ss-tbl tbody td:first-child{position:sticky;left:0;background:var(--card);font-weight:600;z-index:1;border-right:1px solid var(--border)}
    .ss-tbl tbody tr:hover td{background:rgba(255,255,255,.025)}
    .ss-tbl tbody tr:hover td:first-child{background:var(--card2)}
    .ss-num{text-align:right;font-variant-numeric:tabular-nums}
    .ss-center{text-align:center}
    .ss-badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
  </style>
</head>
<body>

<nav class="nav">
  <button onclick="showTab('dashboard')" data-tab="dashboard" class="active">대시보드</button>
  <button onclick="showTab('holdings')" data-tab="holdings">보유종목</button>
  <button onclick="showTab('transactions')" data-tab="transactions">거래내역</button>
  <button onclick="showTab('cashflows')" data-tab="cashflows">입출금</button>
  <button onclick="showTab('dividends')" data-tab="dividends">배당금</button>
  <button onclick="showTab('dca')" data-tab="dca">모으기</button>
  <button onclick="showTab('tax')" data-tab="tax">세금</button>
  <button onclick="showTab('spreadsheet')" data-tab="spreadsheet">📊 시트</button>
  <button onclick="showTab('settings')" data-tab="settings">설정</button>
</nav>

<div class="auth-bar">
  <span id="auth-status" style="color:var(--muted)">Firebase 미설정 — 로컬 저장 모드</span>
  <div id="auth-btns"></div>
</div>
<div id="price-bar" style="background:var(--card2);border-bottom:1px solid var(--border);padding:5px 16px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px">
  <span id="price-bar-text" style="color:var(--muted)">가격 정보 없음</span>
  <span id="price-bar-loading" style="color:var(--accent);display:none">⟳ 가격 업데이트 중…</span>
</div>

<div id="tab-dashboard"    class="tab active"></div>
<div id="tab-holdings"     class="tab"></div>
<div id="tab-transactions" class="tab"></div>
<div id="tab-cashflows"    class="tab"></div>
<div id="tab-dividends"    class="tab"></div>
<div id="tab-dca"          class="tab"></div>
<div id="tab-tax"          class="tab"></div>
<div id="tab-spreadsheet"  class="tab"></div>
<div id="tab-settings"     class="tab"></div>
<div id="toast" class="toast"></div>

<!-- 거래 수정 모달 -->
<div id="edit-tx-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto">
    <div class="row-between" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:600">거래 수정</div>
      <button onclick="closeEditTx()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button>
    </div>
    <div class="form-row">
      <div class="fg fg-md"><label>날짜</label><input type="date" id="etx-date"></div>
      <div class="fg fg-sm"><label>구분</label><select id="etx-type"><option value="buy">매수</option><option value="sell">매도</option></select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>계좌</label><select id="etx-account"></select></div>
      <div class="fg fg-sm"><label>유형</label><select id="etx-asset"><option value="stock">주식</option><option value="etf">ETF</option></select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>티커</label><input type="text" id="etx-ticker" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="fg"><label>종목명</label><input type="text" id="etx-name"></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>수량</label><input type="number" id="etx-qty" step="any" min="0.0001"></div>
      <div class="fg"><label>단가</label><input type="number" id="etx-price" step="any"></div>
      <div class="fg fg-sm"><label>통화</label><select id="etx-currency"><option value="KRW">KRW</option><option value="USD">USD</option></select></div>
    </div>
    <div class="form-row">
      <div class="fg"><label>수수료</label><input type="number" id="etx-fee" step="any" value="0"></div>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-primary" onclick="saveEditTx()">저장</button>
      <button class="btn btn-ghost" onclick="closeEditTx()">취소</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// FIREBASE
// ════════════════════════════════════════════════════════════════
let _db=null,_auth=null,_uid=null,_fbUnsub=null;
const FB_CFG_KEY='fb_config';

function getFbCfg(){try{return JSON.parse(localStorage.getItem(FB_CFG_KEY)||'null')}catch(e){return null}}
function saveFbCfg(cfg){localStorage.setItem(FB_CFG_KEY,JSON.stringify(cfg))}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+src+'"]')){res();return}
    const s=document.createElement('script');
    s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}

async function initFirebase(){
  const cfg=getFbCfg();
  if(!cfg||!cfg.apiKey){updateAuthBar();return}
  try{
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    _db=firebase.firestore();
    _auth=firebase.auth();
    _auth.onAuthStateChanged(user=>{
      if(user){
        _uid=user.uid;
        updateAuthBar(user.displayName||user.email,true);
        fbSubscribe();
      } else {
        _uid=null;
        updateAuthBar(null,false);
        if(_fbUnsub){_fbUnsub();_fbUnsub=null}
        renderAll();
      }
    });
  } catch(e){
    console.error('Firebase init:',e);
    updateAuthBar(null,false,'Firebase 오류: '+e.message);
  }
}

function fbRef(){return(_db&&_uid)?_db.collection('users').doc(_uid).collection('portfolio').doc('main'):null}

function fbSubscribe(){
  const ref=fbRef();if(!ref)return;
  if(_fbUnsub)_fbUnsub();
  _fbUnsub=ref.onSnapshot(snap=>{
    if(snap.exists){
      // 로컬 가격 캐시 보존 — Firestore는 거래/입출금 데이터만 동기화
      const localPrices=S.prices||{};
      const localLastFetch=S._lastFetch;
      const localManualFetch=S._manualFetch;
      const localPriceSource=S._priceSource;
      S=Object.assign(mkState(),snap.data());
      // Firestore에 prices가 없거나 비어있으면 로컬 캐시 사용
      if(!S.prices||!Object.keys(S.prices).length){
        S.prices=localPrices;
        S._lastFetch=localLastFetch;
        S._manualFetch=localManualFetch;
        S._priceSource=localPriceSource;
      }
      migrateAccounts(); // Firebase 데이터 덮어쓴 후에도 계좌 마이그레이션 재실행
      localStorage.setItem(STORAGE_KEY,JSON.stringify(S));
      renderAll();updatePriceBar(false);
    }
  },err=>{toast('⚠️ Firebase 오류: '+err.message)});
}

// ════════════════════════════════════════════════════════════════
// SERVER PRICES (GitHub Pages prices.json)
// ════════════════════════════════════════════════════════════════
async function fetchServerPrices(){
  try{
    const r=await fetch('./prices.json?t='+Date.now(),{signal:AbortSignal.timeout(5000)});
    if(!r.ok)return null;
    const d=await r.json();
    if(!d.updatedAt||!d.prices)return null;
    return d;
  }catch(e){return null}
}

async function loadServerPrices(){
  const server=await fetchServerPrices();
  if(!server)return;
  const serverTime=new Date(server.updatedAt).getTime();
  const localTime=S._lastFetch?new Date(S._lastFetch).getTime():0;
  const manualTime=S._manualFetch?new Date(S._manualFetch).getTime():0;
  // 수동 업데이트가 더 최신이면 서버 데이터 무시
  if(manualTime>serverTime)return;
  if(serverTime>localTime){
    S.prices=Object.assign({},server.prices);
    S._lastFetch=server.updatedAt;
    S._priceSource='server';
    save(false);renderAll();updatePriceBar(false);
  }
}

async function fbSave(){
  const ref=fbRef();if(!ref)return;
  const data=JSON.parse(JSON.stringify(S));
  delete data._cachedRate;delete data._priceSource;
  try{await ref.set(data,{merge:true})}catch(e){console.error('fbSave:',e)}
}

async function fbLogin(){
  if(!_auth){toast('⚠️ Firebase를 먼저 설정하세요');return}
  try{await _auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){toast('⚠️ 로그인 실패: '+e.message)}
}
async function fbLogout(){
  if(!_auth)return;
  try{await _auth.signOut();toast('로그아웃됐습니다')}catch(e){}
}

function updateAuthBar(name,isLoggedIn,errMsg){
  const st=document.getElementById('auth-status');
  const bt=document.getElementById('auth-btns');
  if(!st)return;
  if(errMsg){
    st.textContent=errMsg;st.style.color='var(--red)';bt.innerHTML='';
  } else if(isLoggedIn){
    st.textContent='🔗 동기화 중: '+(name||'사용자');st.style.color='var(--green)';
    bt.innerHTML='<button class="btn-xs btn-del" onclick="fbLogout()">로그아웃</button>';
  } else if(getFbCfg()){
    st.textContent='Firebase 연결됨 — 로그인 필요';st.style.color='var(--yellow)';
    bt.innerHTML='<button class="btn-xs" style="background:var(--accent);color:#fff;border:none;padding:3px 10px;border-radius:6px;cursor:pointer" onclick="fbLogin()">Google로 로그인</button>';
  } else {
    st.textContent='Firebase 미설정 — 로컬 저장 모드';st.style.color='var(--muted)';
    bt.innerHTML='<button class="btn-xs btn-del" onclick="showTab(\'settings\')">설정하기</button>';
  }
}

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
const STORAGE_KEY='portfolio_v5';
const mkState=()=>({
  transactions:[],
  cashflows:[],
  targets:{},
  notes:{},           // {ticker:"text"}
  etfCategories:{},   // {ticker:'monthly'|'index'|'sector'|'stock'}
  accounts:[          // 계좌 목록

function migrateAccounts(){

  const defaultId=S.accounts[0]?.id||'samsung';

  for(const t of S.transactions){if(!t.account){t.account=defaultId;changed=true;}}
  for(const c of S.cashflows){if(!c.account){c.account=defaultId;changed=true;}}
  if(changed)save(false); // localStorage에만 저장 (Firebase는 건드리지 않음)

function migrateOld(){
  if(S.transactions.length>0)return;
  for(const k of['etf_v4','etf_v3','etf_portfolio_v2']){
    const raw=localStorage.getItem(k);if(!raw)continue;
    try{
      const old=JSON.parse(raw);
      const etfs=(old.etfs||[]).filter(e=>e.ticker&&+e.quantity>0);
      if(!etfs.length)continue;
      const today=todayStr();
      for(const e of etfs){
        S.transactions.push({id:uid(),date:today,type:'buy',
          ticker:e.ticker,name:e.name||e.ticker,assetType:'etf',
          qty:+e.quantity,price:+(e.avgPrice||e.avg_price||0),
          currency:e.currency||detectCur(e.ticker),fee:0});
        if(e.targetPct)S.targets[e.ticker]=+e.targetPct;
      }
      if(old.manualRate)S.settings.manualRate=old.manualRate;
      save(false);break;
    }catch(e){}
  }
}

function computeHoldings(accountFilter){
  const map={};
  const txs=accountFilter
    ?S.transactions.filter(t=>t.account===accountFilter)
    :S.transactions;
  const sorted=[...txs].sort((a,b)=>{
    if(a.date!==b.date)return a.date.localeCompare(b.date);
    if(a.type!==b.type)return a.type==='buy'?-1:1; // 같은 날: 매수 먼저, 매도 나중
    return a.id.localeCompare(b.id);
  });
  for(const tx of sorted){
    if(!map[tx.ticker])map[tx.ticker]={
      ticker:tx.ticker,name:tx.name,assetType:tx.assetType||'stock',
      currency:tx.currency,qty:0,avgPrice:0,totalCost:0,realizedPnl:0};
    const h=map[tx.ticker];h.name=tx.name;
    if(tx.type==='buy'){
      const cost=tx.qty*tx.price+(tx.fee||0);
      h.totalCost+=cost;h.qty+=tx.qty;
      h.avgPrice=h.qty>0?h.totalCost/h.qty:0;
    } else {
      h.realizedPnl+=(tx.qty*tx.price-(tx.fee||0))-h.avgPrice*tx.qty;
      h.qty=Math.max(0,h.qty-tx.qty);
      h.totalCost=h.qty*h.avgPrice;
      if(h.qty===0){h.avgPrice=0;h.totalCost=0}
    }
  }
  return map;
}

function getRate(){return S.settings.manualRate||S._cachedRate||1380}
function toKRW(a,c){return c==='USD'?a*getRate():a}

function computeStats(holdings,accountFilter){
  const cfs=accountFilter?S.cashflows.filter(c=>c.account===accountFilter):S.cashflows;
  const txs=accountFilter?S.transactions.filter(t=>t.account===accountFilter):S.transactions;
  let totalVal=0,totalCost=0,totalRealized=0,dayChange=0;
  for(const h of Object.values(holdings)){
    totalRealized+=toKRW(h.realizedPnl,h.currency);
    if(h.qty>0){
      const p=S.prices[h.ticker],price=p?p.price:h.avgPrice;
      totalVal+=toKRW(price*h.qty,h.currency);
      totalCost+=toKRW(h.avgPrice*h.qty,h.currency);
      if(p&&p.dayChg)dayChange+=toKRW(p.dayChg*h.qty,h.currency);
    }
  }
  let cashKRW=0,cashUSD=0;
  for(const cf of cfs){
    const s=cf.type==='deposit'?1:-1;
    if(cf.currency==='KRW')cashKRW+=s*cf.amount;else cashUSD+=s*cf.amount;
  }
  for(const tx of txs){
    const s=tx.type==='buy'?-1:1;
    const a=tx.qty*tx.price+(tx.type==='buy'?(tx.fee||0):-(tx.fee||0));
    if(tx.currency==='KRW')cashKRW+=s*a;else cashUSD+=s*a;
  }
  let netDepKRW=0,netDepUSD=0;
  for(const cf of cfs){
    const s=cf.type==='deposit'?1:-1;
    if(cf.currency==='KRW')netDepKRW+=s*cf.amount;else netDepUSD+=s*cf.amount;
  }
  const rate=getRate(),cashKRWTotal=cashKRW+cashUSD*rate;
  const netInvested=netDepKRW+netDepUSD*rate;
  const unrealized=totalVal-totalCost;

  // Dividend income received
  let divIncome=0;
  for(const d of(S.dividends||[])){
    if(d.received)divIncome+=toKRW((d.amtPerShare||0)*(d.sharesHeld||0),d.currency);
  }
  return{totalVal,totalCost,totalRealized,unrealized,dayChange,
         cashKRW,cashUSD,cashKRWTotal,netInvested,divIncome};
}

// Year-specific PnL for tax
function computeYearPnl(year){
  const sorted=[...S.transactions].sort((a,b)=>a.date.localeCompare(b.date));
  const state={};
  let domestic=0,foreign=0;
  for(const tx of sorted){
    if(!state[tx.ticker])state[tx.ticker]={qty:0,avgPrice:0,totalCost:0,currency:tx.currency};
    const h=state[tx.ticker];
    if(tx.type==='buy'){
      const cost=tx.qty*tx.price+(tx.fee||0);
      h.totalCost+=cost;h.qty+=tx.qty;
      h.avgPrice=h.qty>0?h.totalCost/h.qty:0;
    } else {
      const pnl=(tx.qty*tx.price-(tx.fee||0))-h.avgPrice*tx.qty;
      h.qty=Math.max(0,h.qty-tx.qty);h.totalCost=h.qty*h.avgPrice;
      if(h.qty===0){h.avgPrice=0;h.totalCost=0}
      if(tx.date.startsWith(year)){
        const pnlKRW=toKRW(pnl,tx.currency);
        if(tx.currency==='KRW')domestic+=pnlKRW;else foreign+=pnlKRW;
      }
    }
  }
  return{domestic,foreign};
}

function addHistorySnapshot(kospi,sp500){
  const h=computeHoldings(),stats=computeStats(h,null),today=todayStr();
  if(stats.totalVal===0&&stats.totalCost===0)return;
  S.history=(S.history||[]).filter(e=>e.date!==today);
  S.history.push({date:today,totalVal:stats.totalVal,totalCost:stats.totalCost,
    kospi:kospi||null,sp500:sp500||null});
  if(S.history.length>365)S.history=S.history.slice(-365);
}

async function fetchYF(ticker){
  const url='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?range=1d&interval=1d';
  // 직접 요청 스킵 — 브라우저에서 CORS로 항상 실패하므로 프록시로 바로 시도
  const proxies=[
    'https://corsproxy.io/?'+encodeURIComponent(url),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url)
  ];
  for(const u of proxies){
    try{
      const r=await fetch(u,{signal:AbortSignal.timeout(7000)});
      const d=await r.json();
      const meta=d&&d.chart&&d.chart.result&&d.chart.result[0]&&d.chart.result[0].meta;
      if(meta&&meta.regularMarketPrice){
        const p=meta.regularMarketPrice,prev=meta.previousClose||p;
        return{price:p,dayChg:p-prev,dayPct:((p-prev)/prev)*100,currency:meta.currency};
      }
    }catch(e){}
  }
  return null;
}

async function fetchRate(){
  if(S.settings.manualRate)return S.settings.manualRate;
  try{
    const r=await fetch('https://api.exchangerate-api.com/v4/latest/USD',{signal:AbortSignal.timeout(8000)});
    return(await r.json()).rates.KRW;
  }catch(e){return null}
}

function fmtRelTime(isoStr){
  if(!isoStr)return null;
  const diff=Math.floor((Date.now()-new Date(isoStr).getTime())/1000);
  if(diff<60)return '방금 전';
  if(diff<3600)return Math.floor(diff/60)+'분 전';
  if(diff<86400)return Math.floor(diff/3600)+'시간 전';
  return Math.floor(diff/86400)+'일 전';
}

function updatePriceBar(loading){
  const bar=document.getElementById('price-bar-text');
  const spin=document.getElementById('price-bar-loading');
  if(!bar)return;
  if(loading){spin.style.display='';return}
  spin.style.display='none';
  const t=S._lastFetch;
  const src=S._priceSource==='server'?'📡 서버 종가':S._priceSource==='manual'?'🔄 수동 업데이트':'';
  bar.textContent=t?(src+' 마지막 업데이트: '+fmtRelTime(t)+' ('+new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+')'):'가격 정보 없음 — 가격 업데이트 버튼을 눌러주세요';
}

const CACHE_MINUTES=30;
function isCacheValid(fetchedAt){
  if(!fetchedAt)return false;
  return(Date.now()-new Date(fetchedAt).getTime())<CACHE_MINUTES*60*1000;
}

async function fetchAllPrices(silent){
  const h=computeHoldings(); // 전체 보유종목 기준
  const tickers=Object.keys(h).filter(t=>h[t].qty>0);
  if(!tickers.length){if(!silent)toast('보유 종목이 없습니다');return}
  if(silent&&isCacheValid(S._lastFetch)){updatePriceBar(false);return}
  if(!silent)toast('가격 조회 중…');
  updatePriceBar(true);
  const tickersToFetch=silent?tickers.filter(t=>!isCacheValid(S.prices[t]&&S.prices[t].fetchedAt)):tickers;
  const allTickers=['^KS11','^GSPC',...tickersToFetch];

  try{
    // Vercel API 호출 (KIS + Yahoo Finance 통합)
    const url='/api/price?tickers='+allTickers.map(encodeURIComponent).join(',');
    const res=await fetch(url,{signal:AbortSignal.timeout(15000)});
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();

    const rate=await fetchRate();
    if(rate)S._cachedRate=rate;

    const kospiR=data.prices['^KS11'];
    const sp500R=data.prices['^GSPC'];
    let ok=0;const failed=[];
    for(const t of tickersToFetch){
      const r=data.prices[t];
      if(r){S.prices[t]={price:r.price,dayChg:r.dayChg,dayPct:r.dayPct,
        currency:r.currency,source:r.source||'',fetchedAt:r.fetchedAt||new Date().toISOString()};ok++}
      else failed.push(t);
    }
    addHistorySnapshot(kospiR?kospiR.price:null,sp500R?sp500R.price:null);
    S._lastFetch=new Date().toISOString();
    if(!silent){S._manualFetch=S._lastFetch;S._priceSource='manual';}
    save();renderAll();updatePriceBar(false);
    if(!silent){
      if(failed.length)toast('✅ '+ok+'/'+tickersToFetch.length+'개 완료 | ❌ 실패: '+failed.join(', '),4500);
      else toast('✅ '+ok+'개 종목 업데이트 완료');
    }

  }catch(e){
    // Vercel API 불가 시 기존 Yahoo Finance 직접 호출로 폴백
    console.warn('Vercel API 실패, Yahoo Finance 직접 호출로 폴백:',e.message);
    await fetchAllPricesFallback(silent,tickersToFetch);
  }
}

// 폴백: 기존 Yahoo Finance 프록시 방식
async function fetchAllPricesFallback(silent,tickersToFetch){
  const allTasks=[fetchRate(),fetchYF('^KS11'),fetchYF('^GSPC'),
    ...tickersToFetch.map(t=>fetchYF(t).then(r=>({ticker:t,r})))];
  const[rate,kospiR,sp500R,...stockR]=await Promise.all(allTasks);
  if(rate)S._cachedRate=rate;
  let ok=0;
  for(const{ticker,r}of stockR){
    if(r){S.prices[ticker]={price:r.price,dayChg:r.dayChg,dayPct:r.dayPct,
      currency:r.currency,source:'Yahoo(직접)',fetchedAt:new Date().toISOString()};ok++}
  }
  addHistorySnapshot(kospiR?kospiR.price:null,sp500R?sp500R.price:null);
  S._lastFetch=new Date().toISOString();
  if(!silent){S._manualFetch=S._lastFetch;S._priceSource='manual';}
  save();renderAll();updatePriceBar(false);
  if(!silent)toast('✅ '+ok+'/'+tickersToFetch.length+'개 종목 업데이트 (Yahoo 직접)');
}

function fmtKRW(n){
  if(n==null||isNaN(n))return'-';
  return(n<0?'-':'')+'₩'+Math.abs(Math.round(n)).toLocaleString('ko-KR');
}
function fmtUSD(n){if(n==null||isNaN(n))return'-';return(n<0?'-$':'$')+Math.abs(n).toFixed(2)}
function fmtPrice(n,c){return c==='USD'?fmtUSD(n):fmtKRW(n)}
function fmtPct(n,d){d=d==null?2:d;if(n==null||isNaN(n))return'-';return(n>=0?'+':'')+n.toFixed(d)+'%'}

// ── 티커 매핑 헬퍼 ─────────────────────────────────────────────
// 우선순위: 사용자 학습 > 내장 사전
function lookupTicker(name) {
  if (!name) return '';
  return (S.tickerMap && S.tickerMap[name]) || SAMSUNG_TICKER_MAP[name] || '';
}

// 이름 + 티커가 모두 있으면 자동 저장
function learnTicker(name, ticker) {
  if (!name || !ticker) return;
  if (!S.tickerMap) S.tickerMap = {};
  if (S.tickerMap[name] === ticker) return; // 이미 동일
  S.tickerMap[name] = ticker.toUpperCase();
  save();
}

// 모든 매핑 소스 합쳐서 반환 (자동완성용)
function allTickerMap() {
  return Object.assign({}, SAMSUNG_TICKER_MAP, S.tickerMap || {});
}

// 이름으로 자동완성 후보 반환 (최대 8개)
function suggestByName(query) {
  if (!query || query.length < 1) return [];
  const q = query.toLowerCase();
  const map = allTickerMap();
  return Object.entries(map)
    .filter(([n]) => n.toLowerCase().includes(q))
    .slice(0, 8);
}

// 티커로 이름 역조회
function lookupName(ticker) {
  const map = allTickerMap();
  return Object.entries(map).find(([, t]) => t === ticker)?.[0] || '';
}

// ── ETF 이름 포함 여부로 assetType 추론
function guessAssetType(name) {
  if (!name) return 'stock';
  const etfPrefixes = ['KODEX','TIGER','RISE','HANARO','PLUS','KIWOOM','KoAct','WON','ACE','ARIRANG','SOL','KOSEF','TIMEFOLIO','FOCUS'];
  return etfPrefixes.some(p => name.startsWith(p)) ? 'etf' : 'stock';
}

// 숫자 문자열 → 숫자 (콤마 제거)
function parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  return parseFloat(String(v).replace(/,/g, '')) || 0;
}

let _importParsed = null; // 파싱 결과 임시 저장

function openImportModal() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xls';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
        _importParsed = parseSamsungRows(rows);
        showImportModal();
      } catch(e) { toast('⚠️ 파일 읽기 실패: ' + e.message); }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function parseSamsungRows(rows) {
  // 헤더 행 찾기 (거래일자 포함 행)
  let headerIdx = rows.findIndex(r => r[0] === '거래일자');
  if (headerIdx < 0) headerIdx = 1;
  const header = rows[headerIdx];
  const colIdx = k => header.indexOf(k);
  const C = {
    date: colIdx('거래일자'), type: colIdx('거래명'),
    qty: colIdx('거래수량'), amount: colIdx('거래금액'),
    name: colIdx('종목명'), price: colIdx('거래단가'),
    fee: colIdx('수수료/Fee'), currency: colIdx('통화코드'),
    settle: colIdx('정산금액'),
  };

  const txTypes = new Set(['매수','매수_NXT','매도','매도_NXT']);
  const cashTypes = new Set(['이체입금','이체출금','ISA개설 지원금 입금','이용료입금','이용료출금','배당금출금']);
  const divTypes = new Set(['배당금입금']);

  const transactions = [], cashflows = [], dividends = [], skipped = [];
  // 종목명별 티커 매핑 수집 (자동 + 미확인)
  const nameMap = {}; // {종목명: ticker|null}

  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[C.date] || !r[C.type]) continue;
    const date = String(r[C.date]).slice(0, 10);
    const type = String(r[C.type]).trim();
    const stockName = r[C.name] ? String(r[C.name]).trim() : null;
    const qty = parseNum(r[C.qty]);
    const amount = parseNum(r[C.amount]);
    const price = parseNum(r[C.price]);
    const fee = parseNum(r[C.fee]);

    if (txTypes.has(type)) {
      const isBuy = type === '매수' || type === '매수_NXT';
      if (!nameMap[stockName]) nameMap[stockName] = lookupTicker(stockName) || null;
      transactions.push({ date, type: isBuy ? 'buy' : 'sell', name: stockName, qty, price, fee, amount, _idx: i });
    } else if (divTypes.has(type)) {
      if (stockName && !nameMap[stockName]) nameMap[stockName] = lookupTicker(stockName) || null;
      dividends.push({ date, name: stockName, amount, _idx: i });
    } else if (cashTypes.has(type)) {
      const isDeposit = type.includes('입금');
      cashflows.push({ date, type: isDeposit ? 'deposit' : 'withdraw', amount: Math.abs(amount), memo: type, _idx: i });
    } else {
      skipped.push({ date, type, amount, _idx: i });
    }
  }

  return { transactions, cashflows, dividends, skipped, nameMap };
}

  if (_importParsed) _importParsed.nameMap[name] = input.value.toUpperCase().trim() || null;
  input.className = 'ticker-input ' + (input.value.trim() ? 'ok' : 'missing');
  input.value = input.value.toUpperCase();
}

function closeImportModal() {
  const m = document.getElementById('import-modal');

function confirmImport() {
  const p = _importParsed; if (!p) return;
  const account = document.getElementById('imp-account')?.value || (S.accounts[0]?.id || 'samsung');
  const skipDup = document.getElementById('imp-skip-dup')?.checked !== false;
  const existingKeys = new Set(S.transactions.map(t => t.date + '|' + t.name + '|' + t.qty + '|' + t.type));
  const existingCfKeys = new Set(S.cashflows.map(c => c.date + '|' + c.memo + '|' + c.amount));
  const existingDivKeys = new Set((S.dividends||[]).map(d => d.exDate + '|' + d.name + '|' + d.amtPerShare));

  // 이번 가져오기에서 확인된 매핑 자동 학습
  Object.entries(p.nameMap).forEach(([name, ticker]) => { if (name && ticker) learnTicker(name, ticker); });

  let txAdded = 0, cfAdded = 0, divAdded = 0;

  // 거래내역 (매수/매도)
  for (const tx of p.transactions) {
    const key = tx.date + '|' + tx.name + '|' + tx.qty + '|' + tx.type;
    if (skipDup && existingKeys.has(key)) continue;
    const ticker = (p.nameMap[tx.name] || '').toUpperCase() || tx.name;
    S.transactions.push({
      id: uid(), date: tx.date, type: tx.type,
      ticker, name: tx.name || ticker,
      assetType: guessAssetType(tx.name),
      qty: tx.qty, price: tx.price, fee: tx.fee,
      currency: 'KRW', account,
    });
    txAdded++;
  }

  // 입출금 (현금흐름)
  for (const cf of p.cashflows) {
    const key = cf.date + '|' + cf.memo + '|' + cf.amount;
    if (skipDup && existingCfKeys.has(key)) continue;
    S.cashflows.push({ id: uid(), date: cf.date, type: cf.type, amount: cf.amount, currency: 'KRW', account, memo: cf.memo });
    cfAdded++;
  }

  // 배당금
  if (!S.dividends) S.dividends = [];
  for (const dv of p.dividends) {
    const key = dv.date + '|' + dv.name + '|' + dv.amount;
    if (skipDup && existingDivKeys.has(key)) continue;
    const ticker = (p.nameMap[dv.name] || '').toUpperCase() || dv.name;
    S.dividends.push({
      id: uid(), ticker, name: dv.name || ticker,
      exDate: dv.date, payDate: dv.date,
      amtPerShare: dv.amount, sharesHeld: 1, currency: 'KRW', received: true,
    });
    divAdded++;
  }

  save(); closeImportModal(); renderTransactions();
  toast('✅ 가져오기 완료 — 거래 ' + txAdded + '건 · 입출금 ' + cfAdded + '건 · 배당 ' + divAdded + '건');
}

function toggleMonthTx(id){
  const el=document.getElementById(id);
  const arrow=document.getElementById(id+'-arrow');
  if(!el)return;
  const isOpen=el.style.display!=='none'&&el.style.maxHeight!=='0px'&&el.style.maxHeight!=='';
  if(isOpen){
    el.style.maxHeight=el.scrollHeight+'px';
    requestAnimationFrame(()=>{ el.style.transition='max-height .25s ease'; el.style.maxHeight='0px'; });
    if(arrow)arrow.style.transform='rotate(-90deg)';
  } else {
    el.style.transition='max-height .3s ease';
    el.style.maxHeight=el.scrollHeight+'px';
    setTimeout(()=>{ el.style.maxHeight='none'; },320);
    if(arrow)arrow.style.transform='rotate(0deg)';
  }
}

function renderCashflows(){
  const acctOpts=(S.accounts||[]).map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  const srcCfs=_acctFilter?S.cashflows.filter(c=>c.account===_acctFilter):S.cashflows;
  const srcTxs=_acctFilter?S.transactions.filter(t=>t.account===_acctFilter):S.transactions;
  const cfs=[...srcCfs].sort((a,b)=>b.date.localeCompare(a.date));
  const rate=getRate(),today=todayStr();
  let depKRW=0,wdKRW=0,depUSD=0,wdUSD=0,cashKRW=0,cashUSD=0;
  for(const c of srcCfs){
    const s=c.type==='deposit'?1:-1;
    if(c.currency==='KRW'){depKRW+=c.type==='deposit'?c.amount:0;wdKRW+=c.type==='withdraw'?c.amount:0;cashKRW+=s*c.amount}
    else{depUSD+=c.type==='deposit'?c.amount:0;wdUSD+=c.type==='withdraw'?c.amount:0;cashUSD+=s*c.amount}
  }
  for(const tx of srcTxs){
    const s=tx.type==='buy'?-1:1,a=tx.qty*tx.price+(tx.type==='buy'?(tx.fee||0):-(tx.fee||0));
    if(tx.currency==='KRW')cashKRW+=s*a;else cashUSD+=s*a;
  }
  let rows='';
  for(const c of cfs){
    const acct=S.accounts.find(a=>a.id===c.account)||{name:c.account||'-',color:'#64748b'};
    rows+=`<tr>
      <td class="muted">${c.date}</td>
      <td><span style="font-size:10px;padding:1px 6px;border-radius:10px;background:${acct.color}22;color:${acct.color};font-weight:600">${esc(acct.name)}</span></td>
      <td><span class="badge badge-${c.type==='deposit'?'buy':'sell'}">${c.type==='deposit'?'입금':'출금'}</span></td>
      <td>${c.currency==='KRW'?fmtKRW(c.amount):fmtUSD(c.amount)}</td>
      <td class="muted">${c.currency}</td>
      <td class="muted">${esc(c.memo||'-')}</td>
      <td><button class="btn-xs btn-del" onclick="delCf('${c.id}')">삭제</button></td>
    </tr>`;
  }
  document.getElementById('tab-cashflows').innerHTML=`
    ${acctTabsHTML(_acctFilter,'setCfAcct')}
    <div class="grid4">
      <div class="card"><div class="card-title">총 입금 (KRW)</div><div class="card-val pos">${fmtKRW(depKRW)}</div></div>
      <div class="card"><div class="card-title">총 출금 (KRW)</div><div class="card-val neg">${fmtKRW(wdKRW)}</div></div>
      <div class="card"><div class="card-title">USD 순입금</div><div class="card-val">${fmtUSD(depUSD-wdUSD)}</div></div>
      <div class="card"><div class="card-title">현금 잔고</div>
        <div class="card-val">${fmtKRW(cashKRW+cashUSD*rate)}</div>
        ${cashUSD?`<div class="card-sub">KRW ${fmtKRW(cashKRW)} + USD ${fmtUSD(cashUSD)}</div>`:''}
      </div>
    </div>
    <div class="card">

// DIVIDEND PROJECTION
// ════════════════════════════════════════════════════════════════
function projectNextDividends(data, fromDate){
  const gapMonths=DIV_FREQ_MONTHS[data.frequency]||3;
  fromDate=fromDate||new Date();
  const projections=[];
  const oneYearLater=new Date(fromDate);
  oneYearLater.setFullYear(oneYearLater.getFullYear()+1);

  // 미래 예정 배당 (이미 ex-date가 지나지 않은 것 포함)
  for(const h of(data.history||[])){
    if(new Date(h.date)>=fromDate)
      projections.push({exDate:h.date,amount:h.amount,isProjected:false});
  }

  // 마지막 ex-date 기준으로 미래 프로젝션
  if(data.lastExDate){
    let next=new Date(data.lastExDate);
    next.setMonth(next.getMonth()+gapMonths);
    while(next<=oneYearLater){
      const dateStr=next.toISOString().slice(0,10);
      if(!projections.find(p=>p.exDate===dateStr))
        projections.push({exDate:dateStr,amount:data.avgAmount||data.lastAmount,isProjected:true});
      next=new Date(next);
      next.setMonth(next.getMonth()+gapMonths);
    }
  }
  return projections.sort((a,b)=>a.exDate.localeCompare(b.exDate));
}

// 보유종목 기반 월별 예상 배당금 계산 (KRW)
function calcMonthlyDivMap(){
  const holdings=computeHoldings();
  const rate=getRate();
  const map={}; // {'2026-03': total_krw}
  for(const[ticker,h] of Object.entries(holdings)){
    if(h.qty<=0)continue;
    const data=(S.dividendData||{})[ticker];
    if(!data)continue;
    const projs=projectNextDividends(data,new Date());
    for(const p of projs){
      const ym=p.exDate.slice(0,7);
      const amtKRW=data.currency==='USD'?p.amount*h.qty*rate:p.amount*h.qty;
      map[ym]=(map[ym]||0)+amtKRW;
    }
  }
  return map;
}

async function fetchDividendData(){
  const holdings=computeHoldings();
  const tickers=Object.keys(holdings).filter(t=>holdings[t].qty>0);
  if(!tickers.length){toast('보유 종목이 없습니다');return}
  toast('배당 데이터 조회 중…');
  try{
    const url='/api/dividends?tickers='+tickers.map(encodeURIComponent).join(',');
    const res=await fetch(url,{signal:AbortSignal.timeout(20000)});
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    if(!S.dividendData)S.dividendData={};
    Object.assign(S.dividendData,data.dividends);
    save();renderDividends();
    const ok=data.meta.success,no=data.meta.noData||[];
    let msg=`✅ ${ok}개 종목 배당 데이터 조회 완료`;
    if(no.length)msg+=` | 배당 없음: ${no.join(', ')}`;
    toast(msg,4000);
  }catch(e){
    toast('⚠️ 배당 조회 실패: '+e.message);
  }
}

  const hasDivData=Object.keys(divData).length>0;

  // ── 연간 배당 합산 ─────────────────────────────────────────────
  const monthlyMap=calcMonthlyDivMap();
  const totalAnnual=Object.values(monthlyMap).reduce((a,b)=>a+b,0);
  const totalVal=computeStats(holdings,null).totalVal;
  const divYield=totalVal>0?totalAnnual/totalVal*100:0;
  const avgMonthly=totalAnnual/12;

  // ── 월별 바 차트 데이터 (향후 12개월) ─────────────────────────
  const months=[];
  const chartVals=[];
  for(let i=0;i<12;i++){
    const d=new Date(now);d.setMonth(d.getMonth()+i);
    const ym=d.toISOString().slice(0,7);
    const label=(d.getMonth()+1)+'월';
    months.push(label);chartVals.push(Math.round(monthlyMap[ym]||0));
  }

  // ── 종목별 배당 현황 ──────────────────────────────────────────
  let tickerRows='';
  for(const[ticker,h] of Object.entries(holdings)){
    if(h.qty<=0)continue;
    const data=divData[ticker];
    if(!data){
      tickerRows+=`<tr>

    }
    const annualPerShare=data.avgAmount*(12/DIV_FREQ_MONTHS[data.frequency]);
    const annualKRW=data.currency==='USD'?annualPerShare*h.qty*rate:annualPerShare*h.qty;
    const nextProjs=projectNextDividends(data,now).slice(0,1);
    const nextEx=nextProjs[0]?nextProjs[0].exDate:'-';
    tickerRows+=`<tr>

// DCA (주식모으기)
// ════════════════════════════════════════════════════════════════
const DAY_LABELS = ['월','화','수','목','금','토','일'];

function dcaIsBusinessDay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  return dow !== 0 && dow !== 6;
}

function dcaShouldBuy(plan, dateStr) {
  if (dateStr < plan.startDate) return false;
  if (plan.endDate && dateStr > plan.endDate) return false;
  if (!dcaIsBusinessDay(dateStr)) return false;
  if (plan.frequency === 'daily') return true;
  if (plan.frequency === 'weekly') {
    const d = new Date(dateStr + 'T00:00:00');
    const dow = (d.getDay() + 6) % 7; // 0=월~4=금
    return (plan.daysOfWeek || []).includes(dow);
  }
  return false;
}

function dcaGetBuyDates(plan, fromDate, toDate) {
  const dates = [];
  const cur = new Date(fromDate + 'T00:00:00');
  const end = new Date(toDate + 'T00:00:00');
  while (cur <= end) {
    const ds = cur.toISOString().slice(0, 10);
    if (dcaShouldBuy(plan, ds)) dates.push(ds);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function dcaExistingDates(planId) {
  return new Set(S.transactions.filter(t => t.dcaPlanId === planId).map(t => t.date));
}

function dcaAddTx(plan, dateStr, price) {
  if (!price || price <= 0) return false;
  const qty = plan.currency === 'KRW'
    ? Math.floor(plan.amount / price)
    : parseFloat((plan.amount / getRate() / price).toFixed(6));
  if (qty <= 0) return false;
  S.transactions.push({
    id: uid(), date: dateStr, type: 'buy',
    ticker: plan.ticker, name: plan.name,
    assetType: plan.assetType || 'etf',
    qty, price, currency: plan.currency,
    fee: 0, account: plan.account,
    dcaPlanId: plan.id,
  });
  return true;
}

function dcaFillHistory(plan) {
  const today = todayStr();
  const existing = dcaExistingDates(plan.id);
  const dates = dcaGetBuyDates(plan, plan.startDate, today);
  const missing = dates.filter(d => !existing.has(d));
  if (!missing.length) { toast('추가할 거래가 없습니다'); return; }
  const p = S.prices[plan.ticker];
  if (!p) { toast('⚠️ 현재가 없음 — 먼저 가격을 업데이트하세요'); return; }
  let added = 0;
  for (const d of missing) { if (dcaAddTx(plan, d, p.price)) added++; }
  save(); renderDca();
  toast('✅ ' + plan.ticker + ' — ' + added + '건 추가');
}

function dcaAddToday(planId) {
  const plan = (S.dcaPlans || []).find(p => p.id === planId);
  if (!plan) return;
  const today = todayStr();
  if (!dcaShouldBuy(plan, today)) { toast('오늘은 매수일이 아닙니다'); return; }
  if (dcaExistingDates(planId).has(today)) { toast('오늘 거래가 이미 있습니다'); return; }
  const p = S.prices[plan.ticker];
  if (!p) { toast('⚠️ 현재가 없음'); return; }
  if (dcaAddTx(plan, today, p.price)) { save(); renderDca(); toast('✅ 오늘 ' + plan.ticker + ' 매수 추가'); }
}

function dcaStats(plan) {
  const txs = S.transactions.filter(t => t.dcaPlanId === plan.id);
  const totalQty = txs.reduce((s, t) => s + t.qty, 0);
  const totalCost = txs.reduce((s, t) => s + toKRW(t.qty * t.price, t.currency), 0);
  const p = S.prices[plan.ticker];
  const curPrice = p ? toKRW(p.price, plan.currency) : 0;
  const curVal = curPrice * totalQty;
  const pnl = curVal - totalCost;
  const pnlPct = totalCost > 0 ? pnl / totalCost * 100 : 0;
  const today = todayStr();
  const allDates = dcaGetBuyDates(plan, plan.startDate, today);
  const existing = dcaExistingDates(plan.id);
  const nextDates = dcaGetBuyDates(plan, today,
    new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10))
    .filter(d => d > today).slice(0, 3);
  return { txs, totalQty, totalCost, curVal, pnl, pnlPct, allDates, existing, nextDates };
}

function addDcaPlan() {
  const ticker = (document.getElementById('dca-ticker').value || '').toUpperCase().trim();
  const name   = (document.getElementById('dca-name').value || '').trim();
  const amount = parseFloat(document.getElementById('dca-amount').value);
  const currency = document.getElementById('dca-currency').value;
  const assetType = document.getElementById('dca-asset').value;
  const account = document.getElementById('dca-account').value;
  const freq = document.getElementById('dca-freq').value;
  const startDate = document.getElementById('dca-start').value;
  const endDate = document.getElementById('dca-end').value || null;
  if (!ticker || !amount || !startDate) { toast('⚠️ 티커, 금액, 시작일을 입력하세요'); return; }
  const daysOfWeek = freq === 'weekly'
    ? [0,1,2,3,4].filter(i => document.getElementById('dca-day-' + i) && document.getElementById('dca-day-' + i).checked)
    : [];
  if (freq === 'weekly' && !daysOfWeek.length) { toast('⚠️ 요일을 선택하세요'); return; }
  if (!S.dcaPlans) S.dcaPlans = [];
  S.dcaPlans.push({ id: uid(), ticker, name, currency, assetType, account, amount, frequency: freq, daysOfWeek, startDate, endDate, active: true });
  save(); renderDca(); toast('✅ 모으기 계획 추가됨');
}

function deleteDcaPlan(id) {
  if (!confirm('계획을 삭제합니다. 연결된 거래의 DCA 태그는 제거되지만 거래 자체는 유지됩니다.')) return;
  S.dcaPlans = (S.dcaPlans || []).filter(p => p.id !== id);
  S.transactions.forEach(t => { if (t.dcaPlanId === id) delete t.dcaPlanId; });
  save(); renderDca(); toast('삭제됐습니다');
}

function toggleDcaPlan(id) {
  const p = (S.dcaPlans || []).find(x => x.id === id);
  if (p) { p.active = !p.active; save(); renderDca(); }
}

function renderDcaFreqDetail() {
  const freq = document.getElementById('dca-freq') && document.getElementById('dca-freq').value;
  const el = document.getElementById('dca-freq-detail');
  if (!el) return;
  if (freq === 'weekly') {
    el.innerHTML = '<div style="margin-top:4px"><label style="color:var(--muted);font-size:11px">매수 요일</label><div class="freq-day">'
      + DAY_LABELS.map((d, i) => '<label><input type="checkbox" id="dca-day-' + i + '" ' + (i < 5 ? 'checked' : '') + '><span> ' + d + '</span></label>').join('')
      + '</div></div>';
  } else {
    el.innerHTML = '';
  }
}

let _ssTab = 'holdings';

function renderSpreadsheet() {
  const el = document.getElementById('tab-spreadsheet');
  const holdings = computeHoldings(_acctFilter);
  const rate = getRate();

  // ── 시트 1: 보유종목 ─────────────────────────────────────────
  function sheetHoldings() {
    const rows = Object.values(holdings).filter(h => h.qty > 0);
    if (!rows.length) return '<div class="empty">보유 종목이 없습니다.</div>';
    const totalVal = rows.reduce((s, h) => {
      const p = S.prices[h.ticker];
      return s + toKRW((p ? p.price : h.avgPrice) * h.qty, h.currency);
    }, 0);
    let html = `<table class="ss-tbl"><thead><tr>
      <th>티커</th><th>종목명</th><th>유형</th><th>통화</th>
      <th class="ss-num">보유수량</th><th class="ss-num">평균단가</th>
      <th class="ss-num">현재가</th><th class="ss-num">평가금액(₩)</th>
      <th class="ss-num">매입금액(₩)</th><th class="ss-num">손익(₩)</th>
      <th class="ss-num">수익률</th><th class="ss-num">비중</th>
    </tr></thead><tbody>`;
    for (const h of rows.sort((a,b) => {
      const va = toKRW((S.prices[a.ticker]?.price||a.avgPrice)*a.qty,a.currency);
      const vb = toKRW((S.prices[b.ticker]?.price||b.avgPrice)*b.qty,b.currency);
      return vb - va;
    })) {
      const p = S.prices[h.ticker];
      const curPrice = p ? p.price : h.avgPrice;
      const valKRW = toKRW(curPrice * h.qty, h.currency);
      const costKRW = toKRW(h.avgPrice * h.qty, h.currency);
      const pnl = valKRW - costKRW;
      const pnlPct = costKRW > 0 ? pnl / costKRW * 100 : 0;
      const weight = totalVal > 0 ? valKRW / totalVal * 100 : 0;
      const cls = pnl >= 0 ? 'pos' : 'neg';
      const fmt = n => n.toLocaleString('ko-KR', {maximumFractionDigits:0});
      const fmtP = n => n.toFixed(2) + '%';
      const fmtU = (n, c) => c === 'USD' ? '$' + n.toFixed(2) : fmt(n) + '원';
      html += `<tr>
        <td><code>${h.ticker}</code></td>
        <td>${h.name}</td>
        <td><span class="ss-badge" style="background:${h.assetType==='etf'?'rgba(99,102,241,.2)':'rgba(245,158,11,.2)'};color:${h.assetType==='etf'?'var(--accent)':'var(--yellow)'}">${h.assetType?.toUpperCase()||'STOCK'}</span></td>
        <td class="ss-center">${h.currency}</td>
        <td class="ss-num">${h.qty % 1 === 0 ? h.qty : h.qty.toFixed(4)}</td>
        <td class="ss-num">${fmtU(h.avgPrice, h.currency)}</td>
        <td class="ss-num">${p ? fmtU(curPrice, h.currency) : '<span class="muted">-</span>'}</td>
        <td class="ss-num">${fmt(valKRW)}원</td>
        <td class="ss-num">${fmt(costKRW)}원</td>
        <td class="ss-num ${cls}">${pnl>=0?'+':''}${fmt(pnl)}원</td>
        <td class="ss-num ${cls}">${pnlPct>=0?'+':''}${fmtP(pnlPct)}</td>
        <td class="ss-num muted">${fmtP(weight)}</td>
      </tr>`;
    }
    // 합계 행
    const totalCost = rows.reduce((s,h)=>s+toKRW(h.avgPrice*h.qty,h.currency),0);
    const totalPnl = totalVal - totalCost;
    const totalPct = totalCost > 0 ? totalPnl/totalCost*100 : 0;
    const fmt = n => n.toLocaleString('ko-KR',{maximumFractionDigits:0});
    html += `<tr style="font-weight:700;background:var(--card2)">
      <td colspan="7" style="color:var(--muted)">합계</td>
      <td class="ss-num">${fmt(totalVal)}원</td>
      <td class="ss-num">${fmt(totalCost)}원</td>
      <td class="ss-num ${totalPnl>=0?'pos':'neg'}">${totalPnl>=0?'+':''}${fmt(totalPnl)}원</td>
      <td class="ss-num ${totalPnl>=0?'pos':'neg'}">${totalPct>=0?'+':''}${totalPct.toFixed(2)}%</td>
      <td class="ss-num">100%</td>
    </tr>`;
    return html + '</tbody></table>';
  }

  // ── 시트 2: 배당금 ──────────────────────────────────────────
  function sheetDividends() {
    const divs = (S.dividends || []).sort((a,b) => b.exDate.localeCompare(a.exDate));
    if (!divs.length) return '<div class="empty">배당금 내역이 없습니다.</div>';
    const fmt = n => n.toLocaleString('ko-KR',{maximumFractionDigits:0});
    let html = `<table class="ss-tbl"><thead><tr>
      <th>배당락일</th><th>지급일</th><th>티커</th><th>종목명</th>
      <th class="ss-num">주당배당금</th><th class="ss-num">보유수량</th>
      <th class="ss-num">총배당금</th><th>통화</th>
      <th class="ss-num">원화환산</th><th class="ss-center">수령여부</th>
    </tr></thead><tbody>`;
    let totalKRW = 0;
    for (const d of divs) {
      const total = (d.amtPerShare||0) * (d.sharesHeld||0);
      const krw = toKRW(total, d.currency);
      if (d.received) totalKRW += krw;
      html += `<tr>
        <td>${d.exDate||'-'}</td>
        <td>${d.payDate||'-'}</td>
        <td><code>${d.ticker}</code></td>
        <td>${d.name||'-'}</td>
        <td class="ss-num">${d.currency==='USD'?'$':'₩'}${(d.amtPerShare||0).toFixed(d.currency==='USD'?4:0)}</td>
        <td class="ss-num">${d.sharesHeld||0}</td>
        <td class="ss-num">${d.currency==='USD'?'$'+total.toFixed(2):'₩'+fmt(total)}</td>
        <td class="ss-center">${d.currency}</td>
        <td class="ss-num">${fmt(krw)}원</td>
        <td class="ss-center"><span style="color:${d.received?'var(--green)':'var(--muted)'}">${d.received?'✅':'⏳'}</span></td>
      </tr>`;
    }
    html += `<tr style="font-weight:700;background:var(--card2)">
      <td colspan="8" style="color:var(--muted)">수령 완료 합계</td>
      <td class="ss-num pos">${fmt(totalKRW)}원</td><td></td>
    </tr>`;
    return html + '</tbody></table>';
  }

  // ── 시트 3: 수익분석 ────────────────────────────────────────
  function sheetPnl() {
    const allTickers = [...new Set(S.transactions.map(t=>t.ticker))];
    if (!allTickers.length) return '<div class="empty">거래 내역이 없습니다.</div>';
    const fmt = n => n.toLocaleString('ko-KR',{maximumFractionDigits:0});
    let html = `<table class="ss-tbl"><thead><tr>
      <th>티커</th><th>종목명</th><th>통화</th>
      <th class="ss-num">총매입(₩)</th><th class="ss-num">총매도(₩)</th>
      <th class="ss-num">실현손익(₩)</th>
      <th class="ss-num">평가금액(₩)</th><th class="ss-num">평가손익(₩)</th>
      <th class="ss-num">총손익(₩)</th><th class="ss-num">수익률</th>
    </tr></thead><tbody>`;
    let grandTotalBuy=0,grandTotalSell=0,grandRealized=0,grandUnrealized=0;
    for (const ticker of allTickers.sort()) {
      const h = holdings[ticker];
      const txs = S.transactions.filter(t=>t.ticker===ticker);
      const currency = txs[0]?.currency||'KRW';
      let totalBuy=0,totalSell=0;
      for (const tx of txs) {
        const amt = toKRW(tx.qty*tx.price,tx.currency);
        if(tx.type==='buy')totalBuy+=amt;else totalSell+=amt;
      }
      const realized = toKRW(h?.realizedPnl||0, currency);
      const p = S.prices[ticker];
      const curPrice = p?p.price:(h?.avgPrice||0);
      const unrealized = h&&h.qty>0 ? toKRW((curPrice-h.avgPrice)*h.qty,h.currency) : 0;
      const evalVal = h&&h.qty>0 ? toKRW(curPrice*h.qty,h.currency) : 0;
      const totalPnl = realized + unrealized;
      const pct = totalBuy>0 ? totalPnl/totalBuy*100 : 0;
      const cls = totalPnl>=0?'pos':'neg';
      grandTotalBuy+=totalBuy; grandTotalSell+=totalSell;
      grandRealized+=realized; grandUnrealized+=unrealized;
      html += `<tr>
        <td><code>${ticker}</code></td>
        <td>${txs[0]?.name||'-'}</td>
        <td class="ss-center">${currency}</td>
        <td class="ss-num">${fmt(totalBuy)}원</td>
        <td class="ss-num">${totalSell>0?fmt(totalSell)+'원':'<span class="muted">-</span>'}</td>
        <td class="ss-num ${realized>=0?'pos':'neg'}">${realized>=0?'+':''}${fmt(realized)}원</td>
        <td class="ss-num">${evalVal>0?fmt(evalVal)+'원':'<span class="muted">-</span>'}</td>
        <td class="ss-num ${unrealized>=0?'pos':'neg'}">${h&&h.qty>0?(unrealized>=0?'+':'')+fmt(unrealized)+'원':'<span class="muted">-</span>'}</td>
        <td class="ss-num ${cls}">${totalPnl>=0?'+':''}${fmt(totalPnl)}원</td>
        <td class="ss-num ${cls}">${pct>=0?'+':''}${pct.toFixed(2)}%</td>
      </tr>`;
    }
    const grandTotal=grandRealized+grandUnrealized;
    const grandPct=grandTotalBuy>0?grandTotal/grandTotalBuy*100:0;
    html += `<tr style="font-weight:700;background:var(--card2)">
      <td colspan="3" style="color:var(--muted)">합계</td>
      <td class="ss-num">${fmt(grandTotalBuy)}원</td>
      <td class="ss-num">${grandTotalSell>0?fmt(grandTotalSell)+'원':'-'}</td>
      <td class="ss-num ${grandRealized>=0?'pos':'neg'}">${grandRealized>=0?'+':''}${fmt(grandRealized)}원</td>
      <td></td>
      <td class="ss-num ${grandUnrealized>=0?'pos':'neg'}">${grandUnrealized>=0?'+':''}${fmt(grandUnrealized)}원</td>
      <td class="ss-num ${grandTotal>=0?'pos':'neg'}">${grandTotal>=0?'+':''}${fmt(grandTotal)}원</td>
      <td class="ss-num ${grandTotal>=0?'pos':'neg'}">${grandPct>=0?'+':''}${grandPct.toFixed(2)}%</td>
    </tr>`;
    return html + '</tbody></table>';
  }

  const sheets = { holdings: sheetHoldings, dividends: sheetDividends, pnl: sheetPnl };
  const labels = { holdings: '보유종목', dividends: '배당금', pnl: '수익분석' };

  el.innerHTML = `
    <div style="max-width:100%;padding:16px">
      <div class="row-between" style="margin-bottom:12px">

      <div class="ss-wrap" id="ss-content">
        ${sheets[_ssTab]()}
      </div>
    </div>`;
}

function ssExportExcel() {
  const wb = XLSX.utils.book_new();

  // 시트 1: 보유종목
  const holdings = computeHoldings(_acctFilter);
  const h1 = [['티커','종목명','유형','통화','수량','평균단가','현재가','평가금액(KRW)','매입금액(KRW)','손익(KRW)','수익률(%)','비중(%)']];
  const rate = getRate();
  const allH = Object.values(holdings).filter(h=>h.qty>0);
  const totalVal = allH.reduce((s,h)=>{const p=S.prices[h.ticker];return s+toKRW((p?p.price:h.avgPrice)*h.qty,h.currency);},0);
  for (const h of allH) {
    const p=S.prices[h.ticker], cur=p?p.price:h.avgPrice;
    const val=toKRW(cur*h.qty,h.currency), cost=toKRW(h.avgPrice*h.qty,h.currency);
    const pnl=val-cost, pct=cost>0?pnl/cost*100:0, wt=totalVal>0?val/totalVal*100:0;
    h1.push([h.ticker,h.name,h.assetType,h.currency,h.qty,h.avgPrice,cur,Math.round(val),Math.round(cost),Math.round(pnl),+pct.toFixed(2),+wt.toFixed(2)]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(h1), '보유종목');

  // 시트 2: 배당금
  const h2 = [['배당락일','지급일','티커','종목명','주당배당금','보유수량','총배당금','통화','원화환산','수령여부']];
  for (const d of (S.dividends||[])) {
    const total=(d.amtPerShare||0)*(d.sharesHeld||0);
    h2.push([d.exDate,d.payDate,d.ticker,d.name||'',d.amtPerShare||0,d.sharesHeld||0,total,d.currency,Math.round(toKRW(total,d.currency)),d.received?'수령':'미수령']);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(h2), '배당금');

  // 시트 3: 거래내역
  const h3 = [['날짜','구분','티커','종목명','유형','수량','단가','통화','수수료','계좌']];
  const acctMap = {};
  (S.accounts||[]).forEach(a=>acctMap[a.id]=a.name);
  for (const tx of [...S.transactions].sort((a,b)=>b.date.localeCompare(a.date))) {
    h3.push([tx.date,tx.type==='buy'?'매수':'매도',tx.ticker,tx.name,tx.assetType,tx.qty,tx.price,tx.currency,tx.fee||0,acctMap[tx.account]||tx.account||'']);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(h3), '거래내역');

  // 시트 4: 수익분석
  const allTickers=[...new Set(S.transactions.map(t=>t.ticker))];
  const h4=[['티커','종목명','통화','총매입(KRW)','총매도(KRW)','실현손익(KRW)','평가금액(KRW)','평가손익(KRW)','총손익(KRW)','수익률(%)']];
  for (const ticker of allTickers.sort()) {
    const h=holdings[ticker];
    const txs=S.transactions.filter(t=>t.ticker===ticker);
    const currency=txs[0]?.currency||'KRW';
    let totalBuy=0,totalSell=0;
    for(const tx of txs){const amt=toKRW(tx.qty*tx.price,tx.currency);if(tx.type==='buy')totalBuy+=amt;else totalSell+=amt;}
    const realized=toKRW(h?.realizedPnl||0,currency);
    const p=S.prices[ticker];
    const cur=p?p.price:(h?.avgPrice||0);
    const unrealized=h&&h.qty>0?toKRW((cur-h.avgPrice)*h.qty,h.currency):0;
    const evalVal=h&&h.qty>0?toKRW(cur*h.qty,h.currency):0;
    const totalPnl=realized+unrealized;
    const pct=totalBuy>0?totalPnl/totalBuy*100:0;
    h4.push([ticker,txs[0]?.name||'',currency,Math.round(totalBuy),Math.round(totalSell),Math.round(realized),Math.round(evalVal),Math.round(unrealized),Math.round(totalPnl),+pct.toFixed(2)]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(h4), '수익분석');

  const date=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `포트폴리오_${date}.xlsx`);
  toast('✅ Excel 파일 다운로드 완료');
}

function addAccount(){
  const name=prompt('새 계좌 이름을 입력하세요');
  if(!name||!name.trim())return;
  const colors=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
  const usedColors=(S.accounts||[]).map(a=>a.color);
  const color=colors.find(c=>!usedColors.includes(c))||colors[S.accounts.length%colors.length];
  S.accounts.push({id:uid(),name:name.trim(),color});
  save();renderSettings();toast('✅ 계좌 추가됨: '+name.trim());
}

function renameAccount(id){
  const acct=S.accounts.find(a=>a.id===id);if(!acct)return;
  const name=prompt('계좌 이름 변경',acct.name);
  if(!name||!name.trim())return;
  acct.name=name.trim();save();renderSettings();renderAll();toast('✅ 계좌명 변경됨');
}

function deleteAccount(id){
  if(S.accounts.length<=1){toast('⚠️ 계좌는 최소 1개 이상 필요합니다');return}
  const acct=S.accounts.find(a=>a.id===id);if(!acct)return;
  const cnt=S.transactions.filter(t=>t.account===id).length+S.cashflows.filter(c=>c.account===id).length;
  if(cnt>0&&!confirm(`"${acct.name}"에 거래/입출금 ${cnt}건이 있습니다. 정말 삭제하시겠습니까?`))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);
  save();renderSettings();toast('삭제됨: '+acct.name);
}

function autoDetectCur(){const sel=document.getElementById('tx-currency');if(sel)sel.value=detectCur(v('tx-ticker'))}

// ── 자동완성 엔진 ─────────────────────────────────────────────
let _acActive = -1;

function acInput(nameId, tickerId, assetId) {
  const nameEl = document.getElementById(nameId);
  const query = nameEl?.value || '';
  closeAcDropdown(nameId);

  // 종목명으로 티커 직접 조회
  const exactTicker = lookupTicker(query);
  if (exactTicker) {
    const tickerEl = document.getElementById(tickerId);
    if (tickerEl && !tickerEl.value) {
      tickerEl.value = exactTicker;
      autoDetectCur();
      if (assetId) {
        const at = document.getElementById(assetId);
        if (at) at.value = guessAssetType(query);
      }
    }
  }

  const suggestions = suggestByName(query);
  if (!suggestions.length || !nameEl) return;

  const wrap = nameEl.closest('.ac-wrap') || nameEl.parentElement;
  if (!wrap.classList.contains('ac-wrap')) wrap.classList.add('ac-wrap');
  wrap.style.position = 'relative';

  const dd = document.createElement('div');
  dd.className = 'ac-dropdown'; dd.id = 'ac-' + nameId;
  _acActive = -1;

  dd.innerHTML = suggestions.map(([name, ticker], i) => {
    const isLearned = S.tickerMap && S.tickerMap[name];
    return '<div class="ac-item" data-name="' + name + '" data-ticker="' + ticker + '" data-idx="' + i + '">'
      + '<span class="ac-item-name">' + name + (isLearned ? '<span class="ac-learned">★</span>' : '') + '</span>'
      + '<span class="ac-item-ticker">' + ticker + '</span>'
    + '</div>';
  }).join('');

  dd.querySelectorAll('.ac-item').forEach(item => {
    item.addEventListener('mousedown', e => {
      e.preventDefault();
      acSelect(item.dataset.name, item.dataset.ticker, nameId, tickerId, assetId);
    });
  });

  wrap.appendChild(dd);

  // 키보드 탐색
  nameEl.onkeydown = e => {
    const items = dd.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); _acActive = Math.min(_acActive+1, items.length-1); acHighlight(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _acActive = Math.max(_acActive-1, -1); acHighlight(items); }
    else if (e.key === 'Enter' && _acActive >= 0) { e.preventDefault(); const it = items[_acActive]; acSelect(it.dataset.name, it.dataset.ticker, nameId, tickerId, assetId); }
    else if (e.key === 'Escape') closeAcDropdown(nameId);
  };
}

function acHighlight(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === _acActive));
  if (_acActive >= 0) items[_acActive].scrollIntoView({ block: 'nearest' });
}

function acSelect(name, ticker, nameId, tickerId, assetId) {
  const nameEl = document.getElementById(nameId);
  const tickerEl = document.getElementById(tickerId);
  if (nameEl) nameEl.value = name;
  if (tickerEl) { tickerEl.value = ticker; autoDetectCur(); }
  if (assetId) { const at = document.getElementById(assetId); if (at) at.value = guessAssetType(name); }
  closeAcDropdown(nameId);
}

function closeAcDropdown(nameId) {
  const old = document.getElementById('ac-' + nameId);
  if (old) old.remove();
  _acActive = -1;
}

function acTickerInput(tickerId, nameId) {

  const nameEl = document.getElementById(nameId);
  if (!nameEl || nameEl.value) return;
  const name = lookupName(ticker);
  if (name) nameEl.value = name;
  autoDetectCur();
}

function addTx(){
  const date=v('tx-date'),type=v('tx-type'),ticker=v('tx-ticker').toUpperCase();
  const name=v('tx-name')||ticker,assetType=v('tx-asset');
  const qty=parseFloat(v('tx-qty')),price=parseFloat(v('tx-price'));
  const currency=v('tx-currency'),fee=parseFloat(v('tx-fee'))||0;
  const account=v('tx-account')||S.accounts[0]?.id||'samsung';
  if(!date||!ticker){toast('⚠️ 날짜와 티커를 입력하세요');return}
  if(isNaN(qty)||qty<=0){toast('⚠️ 수량을 입력하세요');return}
  if(isNaN(price)||price<0){toast('⚠️ 단가를 입력하세요');return}
  if(type==='sell'){
    // 같은 계좌 내 보유수량 확인
    const h=computeHoldings(account)[ticker];
    if(!h||h.qty<qty){toast('⚠️ 해당 계좌 보유수량('+((h?h.qty:0).toFixed(4))+')보다 많이 매도할 수 없습니다');return}
  }
  S.transactions.push({id:uid(),date,type,ticker,name,assetType,qty,price,currency,fee,account});
  if(name && ticker && name !== ticker) learnTicker(name, ticker); // 자동 학습
  save();renderTransactions();toast('✅ '+(type==='buy'?'매수':'매도')+' 추가 — '+ticker);
}

function delTx(id){
  if(!confirm('이 거래를 삭제하시겠습니까?'))return;
  S.transactions=S.transactions.filter(t=>t.id!==id);
  save();renderAll();toast('삭제됐습니다');
}

  if(isNaN(qty)||qty<=0){toast('⚠️ 수량을 입력하세요');return}
  if(isNaN(price)||price<0){toast('⚠️ 단가를 입력하세요');return}
  tx.date=document.getElementById('etx-date').value;
  tx.type=document.getElementById('etx-type').value;
  tx.account=document.getElementById('etx-account').value;
  tx.assetType=document.getElementById('etx-asset').value;
  tx.ticker=document.getElementById('etx-ticker').value.toUpperCase();
  tx.name=document.getElementById('etx-name').value||tx.ticker;
  tx.qty=qty;
  tx.price=price;
  tx.currency=document.getElementById('etx-currency').value;
  tx.fee=parseFloat(document.getElementById('etx-fee').value)||0;
  closeEditTx();
  save();renderAll();toast('✅ 거래 수정됨');
}

// 보유종목의 특정 티커 계좌 일괄 변경
function setHoldingAccount(ticker,accountId){
  S.transactions.filter(t=>t.ticker===ticker).forEach(t=>t.account=accountId);
  save();renderHoldings();
  const name=(S.accounts.find(a=>a.id===accountId)||{}).name||accountId;
  toast('✅ '+ticker+' → '+name);
}

function addCf(){
  const date=v('cf-date'),type=v('cf-type'),amount=parseFloat(v('cf-amount'));
  const currency=v('cf-currency'),memo=v('cf-memo');
  const account=v('cf-account')||S.accounts[0]?.id||'samsung';
  if(!date||isNaN(amount)||amount<=0){toast('⚠️ 날짜와 금액을 입력하세요');return}
  S.cashflows.push({id:uid(),date,type,amount,currency,memo,account});
  save();renderCashflows();toast('✅ '+(type==='deposit'?'입금':'출금')+' 추가');
}

function delCf(id){
  if(!confirm('삭제하시겠습니까?'))return;
  S.cashflows=S.cashflows.filter(c=>c.id!==id);
  save();renderCashflows();toast('삭제됐습니다');
}

function prefillDivShares(){
  const ticker=v('div-ticker').toUpperCase();
  const h=computeHoldings();
  const el=document.getElementById('div-shares');
  if(el&&h[ticker]&&h[ticker].qty>0)el.value=h[ticker].qty;
  const nEl=document.getElementById('div-name');
  if(nEl&&h[ticker]&&!nEl.value)nEl.value=h[ticker].name||'';
  const cEl=document.getElementById('div-cur');
  if(cEl)cEl.value=detectCur(ticker);
}

function addDiv(){
  const ticker=v('div-ticker').toUpperCase(),name=v('div-name')||ticker;
  const exDate=v('div-exdate'),payDate=v('div-paydate');
  const amtPerShare=parseFloat(v('div-amt')),currency=v('div-cur');
  const sharesHeld=parseFloat(v('div-shares'))||0;
  if(!ticker||!exDate||isNaN(amtPerShare)||amtPerShare<=0){toast('⚠️ 티커, 배당락일, 주당배당금을 입력하세요');return}
  S.dividends=(S.dividends||[]);
  S.dividends.push({id:uid(),ticker,name,exDate,payDate,amtPerShare,currency,sharesHeld,received:false});
  save();renderDividends();toast('✅ 배당 추가 — '+ticker);
}

function toggleDiv(id,checked){
  const d=(S.dividends||[]).find(x=>x.id===id);
  if(d){d.received=checked;save();renderDividends()}
}

function delDiv(id){
  if(!confirm('삭제하시겠습니까?'))return;
  S.dividends=(S.dividends||[]).filter(x=>x.id!==id);
  save();renderDividends();toast('삭제됐습니다');
}

function setTarget(ticker,val){
  const pct=parseFloat(val);
  S.targets[ticker]=(isNaN(pct)||pct<0)?0:pct;save();
}

function setNote(ticker,text){
  if(!S.notes)S.notes={};
  S.notes[ticker]=text;save();
}

function setEtfCategory(ticker,cat){
  if(!S.etfCategories)S.etfCategories={};
  S.etfCategories[ticker]=cat;save();
  // 대시보드 차트만 갱신
  const el=document.querySelector('.tab.active');
  if(el&&el.id==='tab-dashboard')renderDashboard();
}

function saveRate(){
  const val=parseFloat(document.getElementById('manual-rate').value);
  S.settings.manualRate=isNaN(val)?null:val;
  save();renderSettings();toast('환율 저장됨');
}

async function saveFbConfig(){
  try{
    let txt=v('fb-cfg-input');
    if(!txt){toast('⚠️ Firebase config를 입력하세요');return}
    // 주석줄, import줄 제거
    txt=txt.split('\n').filter(l=>{const t=l.trim();return !t.startsWith('//')&&!t.startsWith('import')&&!t.startsWith('export')}).join('\n');
    // apiKey가 포함된 객체 블록 추출
    const m=txt.match(/\{([\s\S]*?apiKey[\s\S]*?)\}/);
    if(m) txt='{'+m[1]+'}';
    else{const s=txt.indexOf('{');const e=txt.lastIndexOf('}');if(s!==-1&&e!==-1)txt=txt.slice(s,e+1);}
    // JS 객체 키(따옴표 없는)를 JSON 키로 변환
    txt=txt.replace(/([{,]\s*)([a-zA-Z_]\w*)(\s*:)/g,'$1"$2"$3');
    // 후행 쉼표 제거
    txt=txt.replace(/,(\s*[}\]])/g,'$1');
    const cfg=JSON.parse(txt);
    if(!cfg.apiKey||!cfg.projectId){toast('⚠️ 올바른 Firebase config가 아닙니다');return}
    saveFbCfg(cfg);
    toast('Firebase 설정 저장됨. 초기화 중...');
    await initFirebase();
    renderSettings();
  }catch(e){toast('⚠️ config 파싱 오류: '+e.message)}
}

function clearFbConfig(){
  if(!confirm('Firebase 연결을 해제하시겠습니까?'))return;
  localStorage.removeItem(FB_CFG_KEY);
  if(_fbUnsub){_fbUnsub();_fbUnsub=null}
  _db=null;_auth=null;_uid=null;
  updateAuthBar();renderSettings();toast('Firebase 연결 해제됨');
}

function exportData(){
  const h=computeHoldings();
  const etfs=Object.values(h).filter(x=>x.qty>0).map(x=>({
    ticker:x.ticker,name:x.name,quantity:x.qty,avgPrice:x.avgPrice,currency:x.currency}));
  const out=JSON.parse(JSON.stringify(S));
  out.etfs=etfs;out.exportedAt=new Date().toISOString();
  delete out._cachedRate;delete out._lastFetch;
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'portfolio.json'});
  a.click();URL.revokeObjectURL(a.href);toast('내보내기 완료');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.transactions&&!data.cashflows){toast('⚠️ 올바른 포맷이 아닙니다');return}
      if(!confirm('데이터를 불러옵니다. 현재 데이터는 덮어씌워집니다.'))return;
      S=Object.assign(mkState(),data);save();renderAll();toast('✅ 가져오기 완료');
    }catch(ex){toast('⚠️ JSON 파싱 오류')}
  };
  r.readAsText(file);e.target.value='';
}

function clearAll(){
  if(!confirm('⚠️ 모든 데이터가 삭제됩니다.'))return;
  if(!confirm('정말로 초기화하시겠습니까?'))return;
  S=mkState();_charts={};save();renderAll();toast('초기화 완료');
}

function clearTxData(){
  if(!confirm('거래내역, 입출금, 배당금을 모두 삭제합니다.\n계좌·DCA 계획·티커 매핑은 유지됩니다.\n\n계속하시겠습니까?'))return;
  S.transactions=[];S.cashflows=[];S.dividends=[];
  save();renderAll();toast('✅ 거래 데이터 초기화 완료 — 이제 엑셀 파일을 다시 가져오세요');
}

</script>

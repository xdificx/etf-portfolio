name: Daily Price Update

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 18:00 KST (09:00 UTC), 월~금
  workflow_dispatch:         # 수동 실행 가능

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices
        run: python update_prices.py

      - name: Commit prices.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git diff --staged --quiet || git commit -m 'chore: update prices [skip ci]'
          git push
